    knapp.disabled = true;
    knapp.textContent = 'Sletter …';
    rettMelding('');

    Api.deleteOkt(o.id).then(function () {
      lukkRett();
      return lastOkter().then(function () { kvittering('Økta er slettet.', false); });
    }).catch(function (e) {
      knapp.disabled = false;
      knapp.textContent = 'Slett denne økta';
      rettMelding(e.message || 'Kunne ikke slette økta.');
    });
  }

  // ===== Programmet: utskrift og tekst =====
  // Begge bygges av samme OVELSER-liste som skjermen, så et endret mål eller
  // en rettet formulering slår gjennom alle tre stedene uten videre arbeid.
  var SLIK_KJORES = '3 runder gjennom alle fem øvelsene. Minimal pause mellom øvelsene, ' +
    '60 sekunder mellom rundene. De to siste repetisjonene skal kjennes tunge — ' +
    'klarer du 15 lett, er manualen for lett.';
  var PROGRESJON = 'Noter vekt og reps fra den tyngste runden. Neste økt tar du én repetisjon ' +
    'mer, eller går opp til neste manualvekt.';
  var LOGG_RADER = 6;

  function byggUtskrift() {
    var h = '<div class="pr-topp"><p class="pr-kicker">10-minutters manualprogram</p>' +
      '<h1>Styrkelogg</h1></div>';
    h += '<p class="pr-slik"><b>Slik kjører du økta.</b> ' + SLIK_KJORES + '</p>';

    OVELSER.forEach(function (ov, i) {
      h += '<div class="pr-ovelse">' + figurPar(ov.id, 'figurer') +
        '<div class="pr-tekst">' +
          '<p class="pr-navn">' + (i + 1) + '. ' + ov.navn + '</p>' +
          '<p class="pr-maal">' + ov.maal + ' · ' + utstyrTekst(ov) + '</p>' +
          '<p class="pr-slik-tekst">' + ov.slik + '</p>' +
          '<p class="pr-feil">Unngå: ' + ov.feil + '</p>' +
        '</div></div>';
    });

    // Tomt loggskjema, så arket kan henges opp og fylles ut for hånd.
    // «Annet» får sin egen kolonne: løping og sykling hører hjemme i loggen
    // selv om de ikke måles i kilo.
    var celler = OVELSER.map(function (ov) {
      return '<th>' + ov.kort + '</th>';
    }).join('') + '<th>' + ANNET.kort + '</th>';
    var tomme = OVELSER.map(function () { return '<td></td>'; }).join('') + '<td></td>';
    var rader = '';
    for (var r = 0; r < LOGG_RADER; r++) {
      rader += '<tr><td></td>' + tomme + '</tr>';
    }

    h += '<div class="pr-skjema"><h2>Loggskjema</h2>' +
      '<table><thead><tr><th>Dato</th>' + celler + '</tr></thead>' +
      '<tbody>' + rader + '</tbody></table>' +
      '<p class="pr-hint">Noter vekt × reps fra den tyngste runden, for eksempel «24 × 10». ' +
      'Under «Annet» skriver du det som ikke måles i kilo — «Løping 30 min».</p></div>';

    h += '<p class="pr-fot">' + PROGRESJON + ' — bedreliv.netlify.app' +
      (typeof CHANGELOG !== 'undefined' && CHANGELOG.length ? ' · v' + CHANGELOG[0].v : '') + '</p>';

    document.getElementById('utskrift').innerHTML = h;
  }

  function skrivUt() {
    byggUtskrift();
    window.print();
  }

  function programSomTekst() {
    var l = [];
    l.push('STYRKELOGG — 10-minutters manualprogram');
    l.push('');
    l.push(SLIK_KJORES);
    l.push('');
    OVELSER.forEach(function (ov, i) {
      l.push((i + 1) + '. ' + ov.navn.toUpperCase() + ' — ' + ov.maal + ' — ' + utstyrTekst(ov));
      l.push('   ' + ov.slik);
      l.push('   Unngå: ' + ov.feil);
      l.push('');
    });
    l.push('+ ANNET (valgfritt) — løping, sykling, tur');
    l.push('   Alt som ikke måles i kilo. Det teller som en økt, men går ikke');
    l.push('   inn i utviklingskurven.');
    l.push('');
    l.push(PROGRESJON);
    l.push('');
    l.push('Logg øktene i appen: bedreliv.netlify.app');
    return l.join('\n');
  }

  function kopierProgram() {
    var tekst = programSomTekst();
    var kvitt = document.getElementById('program-kvitt');
    var si = function (t) { if (kvitt) kvitt.textContent = t; };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst)
        .then(function () { si('Programmet er kopiert — lim det inn der du vil.'); })
        .catch(function () { si('Fikk ikke kopiert. Bruk «Skriv ut» i stedet.'); });
      return;
    }
    si('Nettleseren din har ikke utklippstavle. Bruk «Skriv ut» i stedet.');
  }

  function programRad() {
    return '<div class="prog-rad">' +
      '<button type="button" class="lenke" id="skriv-ut">Skriv ut programmet</button>' +
      '<button type="button" class="lenke" id="kopier-program">Kopier som tekst</button>' +
      '</div><p class="kvittering prog-kvitt" id="program-kvitt"></p>';
  }

  // ===== Gjengen =====
  // Bedreliv er en venneapp: alle ser alle. Du kan ikke skru av at DU er
  // synlig for andre — men du bestemmer over din egen skjerm, og kan både
  // legge bort hele delen og skjule enkeltpersoner fra din visning.
  var GJENG_KEY = 'bedrelivGjengSkjult';
  var SKJULTE_KEY = 'bedrelivSkjulte';
  var MAL_PER_UKE = 2;   // programmet: to ganger i uka

  function gjengSkjult() {
    try { return localStorage.getItem(GJENG_KEY) === '1'; } catch (e) { return false; }
  }

  function skjultePersoner() {
    try { return JSON.parse(localStorage.getItem(SKJULTE_KEY)) || []; } catch (e) { return []; }
  }

  function lagreSkjulte(liste) {
    try { localStorage.setItem(SKJULTE_KEY, JSON.stringify(liste)); } catch (e) {}
  }


  // Uker på rad med minst to økter. Inneværende uke er ennå ikke over, så den
  // bryter aldri rekka — er den ikke fylt opp, telles det fra forrige uke.
  function ukerPaaRad(dater) { return Beregning.ukerPaaRad(dater, MAL_PER_UKE); }

  // Retningen til én person: samme øvelsesvise trend som din egen utvikling,
  // og så flertallet. Totalvolum per økt ville vært misvisende — en økt der du
  // rakk to øvelser ville sett ut som et fall.
  function personRetning(egneOkter) {
    return Beregning.personRetning(egneOkter, OVELSER.map(function (ov) { return ov.id; }));
  }

  function grupperPerPerson() {
    var pers = {};
    // Alle registrerte er med fra dag én, også før første økt. Navnet fra
    // registeret er fasit; savedBy brukes bare for folk vi ikke fant der.
    brukere.forEach(function (b) {
      if (b && b.id) pers[b.id] = { id: b.id, navn: b.navn || 'Ukjent', registrert: true, okter: [] };
    });
    alleOkter.forEach(function (o) {
      var id = o.ownerId || 'ukjent';
      if (!pers[id]) pers[id] = { id: id, navn: o.savedBy || 'Ukjent', registrert: false, okter: [] };
      if (!pers[id].registrert && o.savedBy) pers[id].navn = o.savedBy;
      pers[id].okter.push(o);
    });
    return pers;
  }

  function gjengData() {
    var pers = grupperPerPerson();
    var naa = ukeNokkel(new Date());
    var meg = Api.currentUserId();

    return Object.keys(pers).map(function (k) {
      var p = pers[k];
      var dater = p.okter.map(function (o) { return new Date(o.dato); });
      return {
        id: p.id,
        navn: p.navn,
        erMeg: p.id === meg,
        antall: p.okter.length,
        iUka: dater.filter(function (d) { return ukeNokkel(d) === naa; }).length,
        rad: ukerPaaRad(dater),
        sist: dater.length ? dater[dater.length - 1] : null,
        sisteOkt: p.okter.length ? p.okter[p.okter.length - 1] : null,
        retning: personRetning(p.okter)
      };
    }).sort(function (a, b) {
      // Flest økter denne uka øverst, så flest uker på rad. Aldri etter vekt:
      // det ville gjort den sterkeste til evig vinner.
      if (b.iUka !== a.iUka) return b.iUka - a.iUka;
      if (b.rad !== a.rad) return b.rad - a.rad;
      return a.navn.localeCompare(b.navn, 'nb');
    });
  }

  // Ukas løft: den største RELATIVE framgangen denne uka, målt mot personens
  // egen forrige økt i samme øvelse. Relativt, ikke absolutt — ellers vinner
  // den tyngste hver uke, og alle andre slutter å se etter.
  function ukasLoft() {
    var pers = grupperPerPerson();
    var naa = ukeNokkel(new Date());
    var best = null;

    Object.keys(pers).forEach(function (k) {
      var p = pers[k];
      OVELSER.forEach(function (ov) {
        var rekke = [];
        p.okter.forEach(function (o) {
          var b = besteRunde(o, ov.id);
          if (b) rekke.push({ dato: new Date(o.dato), e: b });
        });
        if (rekke.length < 2) return;
        var siste = rekke[rekke.length - 1];
        if (ukeNokkel(siste.dato) !== naa) return;
        var forrige = rekke[rekke.length - 2];
        var fra = forrige.e.vekt * forrige.e.reps;
        var til = siste.e.vekt * siste.e.reps;
        if (!fra || til <= fra) return;
        var pst = (til - fra) / fra;
        if (!best || pst > best.pst) {
          best = {
            navn: p.navn, ovelse: ov.navn, pst: pst,
            fra: forrige.e, til: siste.e
          };
        }
      });
    });
    return best;
  }

  function ukePrikker(n) {
    var ut = '<span class="gj-uke" aria-label="' + n + ' av ' + MAL_PER_UKE + ' økter denne uka">';
    for (var i = 0; i < MAL_PER_UKE; i++) ut += '<i' + (i < n ? ' class="fylt"' : '') + '></i>';
    if (n > MAL_PER_UKE) ut += '<em>+' + (n - MAL_PER_UKE) + '</em>';
    return ut + '</span>';
  }

  function sidenTekst(d) {
    if (!d) return 'ingen økter ennå';
    var dager = Math.round((ukeStart(new Date()).getTime() - ukeStart(d).getTime()) / 604800000);
    var iDag = new Date(); iDag.setHours(0, 0, 0, 0);
    var da = new Date(d); da.setHours(0, 0, 0, 0);
    var diff = Math.round((iDag - da) / 86400000);
    if (diff <= 0) return 'trente i dag';
    if (diff === 1) return 'trente i går';
    if (diff < 7) return 'trente for ' + diff + ' dager siden';
    if (diff < 14) return 'trente forrige uke';
    return 'sist for ' + Math.floor(diff / 7) + ' uker siden';
  }

  function gjengenBlokk() {
    var h = '<h2 class="seksjon gj-seksjon">Gjengen' +
      '<button type="button" class="lenke" id="gj-bryter">' +
      (gjengSkjult() ? 'Vis' : 'Skjul') + '</button></h2>';

    if (gjengSkjult()) {
      return h + '<p class="tomt">Gjengen er lagt bort på din skjerm. De andre ser deg fortsatt — ' +
        'det er hele poenget med en venneapp.</p>';
    }

    var alle = gjengData();
    // Spørsmålet er om det finnes NOEN ANDRE enn meg, ikke hvor mange rader
    // lista har. Teller man rader, forsvinner en venn i det øyeblikket jeg
    // selv mangler fra lista — og meldingen påstår «bare deg her» om en liste
    // som inneholder vennen og ikke meg.
    var andre = alle.filter(function (p) { return !p.erMeg; });
    if (!andre.length) {
      return h + '<p class="tomt">Foreløpig er det bare deg her. Inviter noen, så blir det gøyere.</p>' +
        inviterKnapp();
    }

    var skjulte = skjultePersoner();
    var vist = alle.filter(function (p) { return skjulte.indexOf(p.id) < 0; });

    var loft = ukasLoft();
    var loftHtml = loft
      ? '<div class="gj-loft"><p class="gj-loft-merke">Ukas løft</p>' +
        '<p class="gj-loft-navn">' + esc(loft.navn) + '</p>' +
        '<p class="gj-loft-tall">' + loft.ovelse + ': ' + loft.fra.vekt + ' kg × ' + loft.fra.reps +
        ' → <b>' + loft.til.vekt + ' kg × ' + loft.til.reps + '</b> ' +
        '(+' + Math.round(loft.pst * 100) + ' %)</p></div>'
      : '<div class="gj-loft"><p class="gj-loft-merke">Ukas løft</p>' +
        '<p class="gj-loft-tall">Ingen har slått seg selv denne uka ennå. Det er fortsatt tid.</p></div>';

    var rader = vist.map(function (p) {
      var ord = p.antall === 0 ? 'Ikke i gang ennå'
        : p.retning ? trendMerke(p.retning) : 'For få økter';
      var klasse = p.retning || '';
      var biter = [];
      if (p.antall === 0) {
        // «0 økter totalt · ingen økter ennå» sier det samme to ganger.
        biter.push(p.erMeg ? 'du har ikke loggført noe ennå' : 'har ikke loggført noe ennå');
      } else {
        if (p.rad) biter.push(p.rad + (p.rad === 1 ? ' uke på rad' : ' uker på rad'));
        biter.push(sidenTekst(p.sist));
        biter.push(p.antall + (p.antall === 1 ? ' økt totalt' : ' økter totalt'));
      }

      return '<div class="gj-rad">' +
        '<div class="gj-hode">' +
          '<b>' + esc(p.navn) + (p.erMeg ? ' <em>(deg)</em>' : '') + '</b>' +
          ukePrikker(p.iUka) +
          heiaropKnapp(p) +
          (p.erMeg ? '' : '<button type="button" class="gj-x" data-skjul="' + p.id +
            '" aria-label="Skjul ' + esc(p.navn) + ' fra min visning">✕</button>') +
        '</div>' +
        '<p class="gj-under"><span class="gj-dom ' + klasse + '">' + ord + '</span> · ' +
        biter.join(' · ') + '</p>' +
        heiaropLinje(p) +
        '</div>';
    }).join('');

    var skjultHtml = '';
    if (skjulte.length) {
      var navn = alle.filter(function (p) { return skjulte.indexOf(p.id) >= 0; });
      skjultHtml = '<p class="gj-skjulte">Skjult på din skjerm: ' +
        navn.map(function (p) {
          return '<button type="button" class="lenke" data-vis="' + p.id + '">' + esc(p.navn) + '</button>';
        }).join(', ') + ' — trykk for å hente tilbake.</p>';
    }

    return h + loftHtml + rader + skjultHtml + inviterKnapp();
  }

  // Heiaropet henger på personens SISTE økt — det er den man heier på når man
  // ser at noen har trent. Trykk igjen tar det bort.
  function heiaropListe(p) {
    return (p.sisteOkt && Array.isArray(p.sisteOkt.heiarop)) ? p.sisteOkt.heiarop : [];
  }

  function heiaropKnapp(p) {
    // Du kan ikke heie på deg selv — men du ser hvem som heier på deg.
    if (p.erMeg || !p.sisteOkt) return '';
    var liste = heiaropListe(p);
    var meg = Api.currentUserId();
    var mitt = liste.some(function (h) { return h && h.id === meg; });
    return '<button type="button" class="gj-heia' + (mitt ? ' mitt' : '') + '"' +
      ' data-heia="' + p.sisteOkt.id + '"' +
      ' aria-label="' + (mitt ? 'Ta bort heiaropet ditt til ' : 'Hei på ') + esc(p.navn) + '">' +
      '👏' + (liste.length ? ' <span>' + liste.length + '</span>' : '') + '</button>';
  }

  function heiaropLinje(p) {
    var liste = heiaropListe(p);
    if (!liste.length) return '';
    var meg = Api.currentUserId();
    var navn = liste.map(function (h) { return h.id === meg ? 'Du' : (h.navn || 'Noen'); });
    // «Du» først når du er med — det er slik man leser en slik setning.
    navn.sort(function (a, b) { return a === 'Du' ? -1 : b === 'Du' ? 1 : 0; });
    var tekst = navn.length === 1 ? navn[0]
      : navn.slice(0, -1).join(', ') + ' og ' + navn[navn.length - 1];
    var verb = (navn.length === 1 && navn[0] === 'Du') ? 'heier' : 'heier';
    return '<p class="gj-heiere">' + esc(tekst) + ' ' + verb + ' på siste økt</p>';
  }

  function inviterKnapp() {
    return '<button type="button" class="inviter" id="inviter">Inviter en venn</button>' +
      '<p class="kvittering" id="invitert"></p>';
  }

  function kobleGjengen() {
    var bryter = document.getElementById('gj-bryter');
    if (bryter) bryter.addEventListener('click', function () {
      try { localStorage.setItem(GJENG_KEY, gjengSkjult() ? '0' : '1'); } catch (e) {}
      tegn();
    });

    var vert = document.getElementById('innhold');
    vert.querySelectorAll('[data-skjul]').forEach(function (k) {
      k.addEventListener('click', function () {
        var liste = skjultePersoner();
        liste.push(k.getAttribute('data-skjul'));
        lagreSkjulte(liste);
        tegn();
      });
    });
    vert.querySelectorAll('[data-vis]').forEach(function (k) {
      k.addEventListener('click', function () {
        var id = k.getAttribute('data-vis');
        lagreSkjulte(skjultePersoner().filter(function (x) { return x !== id; }));
        tegn();
      });
    });

    vert.querySelectorAll('[data-heia]').forEach(function (k) {
      k.addEventListener('click', function () { heiPaa(k, k.getAttribute('data-heia')); });
    });

    var inv = document.getElementById('inviter');
    if (inv) inv.addEventListener('click', inviter);
  }

  function heiPaa(knapp, oktId) {
    knapp.disabled = true;
    Api.heiarop(oktId).then(function (svar) {
      // Oppdater økta vi alt har i minnet, så skjermen kan tegnes uten å
      // hente hele lista på nytt.
      for (var i = 0; i < alleOkter.length; i++) {
        if (alleOkter[i].id === oktId) { alleOkter[i].heiarop = svar.heiarop; break; }
      }
      tegn();
    }).catch(function (e) {
      knapp.disabled = false;
      var kvitt = document.getElementById('invitert');
      if (kvitt) kvitt.textContent = e.message || 'Kunne ikke heie akkurat nå.';
    });
  }

  function inviter() {
    var lenke = location.origin + location.pathname;
    var tekst = 'Bli med i styrkeloggen — 10 minutter, to ganger i uka.';
    var kvitt = document.getElementById('invitert');
    var si = function (t) { if (kvitt) kvitt.textContent = t; };

    if (navigator.share) {
      // Avbryter du delingsmenyen, kaster den. Det er ikke en feil å melde om.
      navigator.share({ title: 'Bedreliv — Styrkelogg', text: tekst, url: lenke }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst + ' ' + lenke)
        .then(function () { si('Lenka er kopiert — lim den inn der du vil.'); })
        .catch(function () { si(lenke); });
      return;
    }
    si(lenke);
  }

  // ===== Lagring mot backend =====
  function lagre(fraFokus) {
    var ovelser = {};
    OVELSER.forEach(function (ov) {
      var runder = utkastRunder(ov.id).filter(function (r) { return r && r.vekt && r.reps; })
        .map(function (r) { return { vekt: r.vekt, reps: r.reps }; });
      if (runder.length) ovelser[ov.id] = runder;
    });
    var annet = annetFraUtkast();
    if (!Object.keys(ovelser).length && !annet) return;

    var knapp = document.getElementById(fraFokus ? 'fokus-fram' : 'lagre');
    var opprinnelig = knapp ? knapp.textContent : '';
    if (knapp) { knapp.disabled = true; knapp.textContent = 'Lagrer …'; }

    Api.saveOkt(ovelser, valgtDatoISO(), annet).then(function (okt) {
      okter.push(okt);
      alleOkter.push(okt);
      var etterDato = function (a, b) { return new Date(a.dato) - new Date(b.dato); };
      okter.sort(etterDato);
      alleOkter.sort(etterDato);
      utkast = {};
      utkastAnnet = { hva: '', minutter: '' };
      apenSatt = false; // ny økt: åpne første øvelse igjen
      oktDato = null;   // neste økt gjelder i dag igjen
      fokusPos = 0;     // ny økt starter øverst i sirkelen igjen
      // Lagret fra fokus: lukk stille og la loggskjermen bak vise kvitteringen.
      if (fraFokus) lukkFokus(true);
      tegn();
      oppdaterAntall();
      kvittering('Økta er lagret.', false);
    }).catch(function (e) {
      // Utkastet står igjen i feltene, så løftene ikke går tapt om nettet svikter.
      if (knapp) { knapp.disabled = false; knapp.textContent = opprinnelig; }
      var melding = e.message || 'Kunne ikke lagre økta.';
      if (fraFokus) {
        var v = document.getElementById('fokus-vaken');
        if (v) { v.textContent = melding; v.style.color = 'var(--varsel)'; }
      } else {
        kvittering(melding, true);
      }
    });
  }

  function tomLogg() {
    if (!okter.length) return;
    if (!confirm('Sletter alle ' + okter.length + ' øktene. Dette kan ikke angres.')) return;

    var knapp = document.getElementById('slett');
    if (knapp) { knapp.disabled = true; knapp.textContent = 'Sletter …'; }

    var uid = Api.currentUserId();
    Promise.all(okter.map(function (o) { return Api.deleteOkt(o.id); })).then(function () {
      okter = [];
      alleOkter = alleOkter.filter(function (o) { return o.ownerId !== uid; });
      tegn();
      oppdaterAntall();
      kvittering('Loggen er tømt.', false);
    }).catch(function (e) {
      // Noen økter kan ha blitt slettet før det stoppet opp. Hent på nytt, så
      // skjermen viser det som faktisk står igjen på serveren.
      var melding = e.message || 'Kunne ikke tømme loggen.';
      lastOkter().then(function () { kvittering(melding, true); }).catch(function () {
        if (knapp) { knapp.disabled = false; knapp.textContent = 'Tøm hele loggen'; }
        kvittering(melding, true);
      });
    });
  }

  function lastOkter() {
    return Promise.all([
      Api.listOkter(),
      // Brukerlista er det som gjør at nyregistrerte vises i gjengen før de har
      // trent. Svikter den, faller vi tilbake på dem som har økter — bedre en
      // mager gjengliste enn en tom skjerm.
      Api.listBrukere().catch(function () { return []; })
    ]).then(function (svar) {
      // Serveren gir hele gjengen. «Forrige økt», loggen og din egen utvikling
      // skal bare regne på dine egne — ellers ville du blitt sammenliknet med
      // en venn uten å vite det.
      alleOkter = svar[0];
      brukere = svar[1];
      var uid = Api.currentUserId();
      okter = alleOkter.filter(function (o) { return o.ownerId === uid; });
      tegn();
      oppdaterAntall();
    });
  }

  // ===== Versjon og endringslogg =====
  // Nummeret leses fra toppen av CHANGELOG, så det kan aldri komme ut av takt
  // med loggen. Mangler changelog.js, skjules merket i stedet for å vise «?».
  // Stempelet under appnavnet: hvem du er logget inn som, og hvilken dag det
  // er. Er du ikke logget inn ennå, står bare datoen der.
  function oppdaterStempel(navn) {
    var el = document.getElementById('stempel');
    if (!el) return;
    var dag = datoTekst(new Date().toISOString());
    el.textContent = navn ? navn + ' · ' + dag : dag;
  }

  // Tre temavalg, som i UltimatePizza: system følger telefonen, lys og mørk
  // overstyrer. Standard er mørk. Klassen settes av skriptet i <head> ved
  // oppstart — her bytter vi den videre og husker valget.
  var TEMAER = ['mork', 'lys', 'system'];
  var TEMA_IKON = { mork: '☾', lys: '☀', system: '◐' };
  var TEMA_NAVN = { mork: 'Mørkt tema', lys: 'Lyst tema', system: 'Følger telefonen' };

  function lagretTema() {
    try {
      var v = localStorage.getItem('bedrelivTema');
      return TEMAER.indexOf(v) >= 0 ? v : 'mork';
    } catch (e) { return 'mork'; }
  }

  function lystNa(valg) {
    if (valg === 'lys') return true;
    if (valg === 'mork') return false;
    try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); }
    catch (e) { return false; }
  }

  function settTema(valg, husk) {
    if (TEMAER.indexOf(valg) < 0) valg = 'mork';
    if (lystNa(valg)) document.documentElement.setAttribute('data-tema', 'lys');
    else document.documentElement.removeAttribute('data-tema');
    var k = document.getElementById('tema');
    if (k) {
      k.textContent = TEMA_IKON[valg];
      k.title = TEMA_NAVN[valg];
      k.setAttribute('aria-label', TEMA_NAVN[valg]);
      k.setAttribute('data-tema-valg', valg);
    }
    if (husk) { try { localStorage.setItem('bedrelivTema', valg); } catch (e) {} }
  }

  function kobleTema() {
    var k = document.getElementById('tema');
    if (!k) return;
    // Står valget på «system», skal appen snu med telefonen — også mens den
    // ligger åpen, som når nattmodus slår inn av seg selv.
    try {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var lytt = function () { if (lagretTema() === 'system') settTema('system', false); };
      if (mq.addEventListener) mq.addEventListener('change', lytt);
      else if (mq.addListener) mq.addListener(lytt);
    } catch (e) { /* uten matchMedia står appen på det valgte temaet */ }
    k.addEventListener('click', function () {
      var na = TEMAER.indexOf(lagretTema());
      settTema(TEMAER[(na + 1) % TEMAER.length], true);
    });
    settTema(lagretTema(), false);
  }

  function visVersjon() {
    var el = document.getElementById('versjon');
    if (typeof CHANGELOG === 'undefined' || !CHANGELOG.length) return;
    el.textContent = 'v' + CHANGELOG[0].v;
    el.hidden = false;
    el.addEventListener('click', apneEndringer);
    document.getElementById('endr-lukk').addEventListener('click', lukkEndringer);
  }

  function apneEndringer() {
    var h = CHANGELOG.map(function (post) {
      return '<div class="endr-post">' +
        '<div class="endr-nr"><b>v' + post.v + '</b><span>' + post.d + '</span></div>' +
        '<ul>' + post.changes.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>' +
        '</div>';
    }).join('');
    document.getElementById('endr-body').innerHTML = h;
    document.getElementById('endringer').classList.add('apen');
    document.getElementById('endringer').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function lukkEndringer() {
    document.getElementById('endringer').classList.remove('apen');
    document.getElementById('endringer').setAttribute('aria-hidden', 'true');
    // Fokus kan ligge åpent bak; da skal rullesperren bli stående.
    if (!fokusErApen()) document.body.style.overflow = '';
  }

  function endringerErApne() {
    return document.getElementById('endringer').classList.contains('apen');
  }

  // ===== Tekststørrelse =====
  // Settes som data-skala på <html>, som all font-size regner ut fra. Valget
  // huskes lokalt — det er en egenskap ved telefonen din, ikke ved kontoen.
  var SKALA_KEY = 'bedrelivTekst';
  var SKALAER = ['normal', 'stor', 'storre', 'storst'];

  function settTekstStorrelse(navn, lagre) {
    if (SKALAER.indexOf(navn) < 0) navn = 'normal';
    if (navn === 'normal') document.documentElement.removeAttribute('data-skala');
    else document.documentElement.setAttribute('data-skala', navn);
    if (lagre) { try { localStorage.setItem(SKALA_KEY, navn); } catch (e) {} }
    var knapper = document.querySelectorAll('#tekststorrelse button');
    for (var i = 0; i < knapper.length; i++) {
      knapper[i].classList.toggle('valgt', knapper[i].getAttribute('data-skala') === navn);
    }
  }

  function lagretTekstStorrelse() {
    try { return localStorage.getItem(SKALA_KEY) || 'normal'; } catch (e) { return 'normal'; }
  }

  function kobleTekstStorrelse() {
    var boks = document.getElementById('tekststorrelse');
    boks.addEventListener('click', function (e) {
      var k = e.target.closest('button[data-skala]');
      if (k) settTekstStorrelse(k.getAttribute('data-skala'), true);
    });
    settTekstStorrelse(lagretTekstStorrelse(), false);
  }

  // ===== Fokus: én øvelse i fullskjerm =====
  // Bruksmønsteret er hele begrunnelsen: telefonen ligger på benken mellom
  // settene, du har manualer i hendene og vil ikke sikte på små felter eller
  // se skjermen sovne midt i en runde.
  // Posisjonen i sirkelen: 0 .. (RUNDER * antall øvelser - 1). Runde og øvelse
  // regnes ut av den, så «neste» går fra siste øvelse i runde 1 rett til
  // første øvelse i runde 2 — slik du faktisk trener.
  var fokusPos = 0;
  var fokusWake = null;

  function fokusAntallSteg() { return RUNDER * OVELSER.length; }
  function fokusRunde() { return Math.floor(fokusPos / OVELSER.length); }
  function fokusIdx() { return fokusPos % OVELSER.length; }
  function fokusOvelse() { return OVELSER[fokusIdx()]; }

  function fokusErApen() {
    return document.getElementById('fokus').classList.contains('apen');
  }

  // Wake Lock finnes ikke i alle nettlesere. Feiler den, går fokus fint
  // uten — vi lover bare våken skjerm når vi faktisk har fått låsen.
  function taWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (l) {
      fokusWake = l;
      var v = document.getElementById('fokus-vaken');
      if (v) v.textContent = 'Skjermen holdes våken';
    }).catch(function () { fokusWake = null; });
  }

  function slippWakeLock() {
    try { if (fokusWake) fokusWake.release(); } catch (e) {}
    fokusWake = null;
  }

  function apneFokus() {
    // Har du vært i fokus i denne økta, fortsetter du der du slapp. Ellers
    // starter vi på første øvelse som ikke er fylt ut — der du sannsynligvis er.
    if (!fokusPos) {
      var start = -1;
      for (var i = 0; i < fokusAntallSteg(); i++) {
        var u = utkastRunder(OVELSER[i % OVELSER.length].id)[Math.floor(i / OVELSER.length)] || {};
        if (!(u.vekt && u.reps)) { start = i; break; }
      }
      fokusPos = start >= 0 ? start : 0;
    }
    document.getElementById('fokus').classList.add('apen');
    document.getElementById('fokus').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    // Telefonen ligger ofte et stykke unna mens du trener, så fokus bruker
    // største trinn uansett hva som er valgt ellers. Valget ditt røres ikke —
    // det leses tilbake når fokus lukkes.
    document.documentElement.setAttribute('data-skala', 'storst');
    taWakeLock();
    tegnFokus();
  }

  function lukkFokus(stille) {
    document.getElementById('fokus').classList.remove('apen');
    document.getElementById('fokus').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    settTekstStorrelse(lagretTekstStorrelse(), false);   // tilbake til ditt valg
    slippWakeLock();
    // Tallene du skrev i fokus skal stå i lista bak når du kommer tilbake.
    if (!stille) tegn();
  }

  function fokusGaTil(pos) {
    if (pos < 0 || pos >= fokusAntallSteg()) return;
    fokusPos = pos;
    tegnFokus();
  }

  function tegnFokus() {
    var ov = fokusOvelse();
    var sist = sisteFor(ov.id);
    var u = utkastRunder(ov.id)[fokusRunde()] || {};
    var siste = fokusPos === fokusAntallSteg() - 1;
    var andel = Math.round((fokusPos + 1) / fokusAntallSteg() * 100);

    var h = '';
    h += '<div class="fokus-topp">';
    h += '  <span class="fokus-teller">Runde ' + (fokusRunde() + 1) + '/' + RUNDER +
         ' <em>·</em> Øvelse ' + (fokusIdx() + 1) + '/' + OVELSER.length + '</span>';
    h += '  <button class="fokus-x" id="fokus-lukk" aria-label="Lukk fokus">✕</button>';
    h += '</div>';
    h += '<div class="fokus-strek"><i style="width:' + andel + '%"></i></div>';
    h += '<div class="fokus-runder">' + rundePrikker() + '</div>';

    h += '<div class="fokus-rull">';
    h += figurPar(ov.id, 'fokus-figurer');
    h += '  <h2 class="fokus-navn">' + ov.navn + '</h2>';
    h += '  <p class="fokus-maal">' + ov.maal + ' · <b>' + utstyrTekst(ov) + '</b></p>';

    if (sist) {
      h += '  <p class="fokus-forrige">Forrige økt: <b>' + sist.vekt + ' kg × ' + sist.reps +
           '</b> — det er tallet du skal slå.</p>';
    } else {
      h += '  <p class="fokus-forrige">Ingen tidligere logg — dette blir utgangspunktet.</p>';
    }

    // De andre rundene du alt har ført inn på denne øvelsen i dag. Nyttig når
    // du står i runde tre og ikke husker hva du tok i runde én.
    var andre = [];
    utkastRunder(ov.id).forEach(function (rr, i) {
      if (i !== fokusRunde() && rr && rr.vekt && rr.reps) {
        andre.push('R' + (i + 1) + ' ' + rr.vekt + '×' + rr.reps);
      }
    });
    if (andre.length) {
      h += '  <p class="fokus-tidligere">I dag: ' + andre.join(' · ') + '</p>';
    }

    h += '  <div class="fokus-felter">';
    h += '    <div class="fokus-felt"><label for="fv">Vekt (kg)</label>';
    h += '      <input id="fv" type="number" inputmode="decimal" step="0.5" min="0" placeholder="–" value="' + (u.vekt != null ? u.vekt : '') + '"></div>';
    h += '    <div class="fokus-felt"><label for="fr">Reps</label>';
    h += '      <input id="fr" type="number" inputmode="numeric" step="1" min="0" placeholder="–" value="' + (u.reps != null ? u.reps : '') + '"></div>';
    h += '  </div>';
    h += '  <div class="fokus-dom" id="fokus-dom"></div>';

    h += '  <p class="fokus-slik">' + ov.slik + '</p>';
    h += '  <p class="fokus-feil">Unngå: ' + ov.feil + '</p>';
    h += '  <p class="fokus-vaken" id="fokus-vaken">' + (fokusWake ? 'Skjermen holdes våken' : '') + '</p>';
    h += '</div>';

    h += '<div class="fokus-bunn">';
    h += '  <button class="fokus-tilbake" id="fokus-tilbake"' + (fokusPos === 0 ? ' disabled' : '') + '>← Forrige</button>';
    h += '  <button class="fokus-fram" id="fokus-fram">' + (siste ? 'Lagre økta' : 'Neste →') + '</button>';
    h += '</div>';

    document.getElementById('fokus-body').innerHTML = h;
    koblingerFokus(siste);
    oppdaterFokusDom();
  }

  // Én prikkerad per runde, én prikk per øvelse. Ferdige steg er fylt, det du
  // står på er ringet inn. Prikkene er tappbare, så du kan hoppe.
  function rundePrikker() {
    var ut = '';
    for (var r = 0; r < RUNDER; r++) {
      ut += '<span class="rundegruppe">';
      for (var i = 0; i < OVELSER.length; i++) {
        var pos = r * OVELSER.length + i;
        var klasse = 'prikk';
        if (pos < fokusPos) klasse += ' gjort';
        if (pos === fokusPos) klasse += ' na';
        ut += '<button type="button" class="' + klasse + '" data-pos="' + pos + '" aria-label="Runde ' +
              (r + 1) + ', øvelse ' + (i + 1) + '"></button>';
      }
      ut += '</span>';
    }
    return ut;
  }

  // Dommen oppdateres for seg, ikke ved å tegne hele skjermen på nytt — ellers
  // mister feltet du skriver i markøren for hvert tastetrykk.
  function oppdaterFokusDom() {
    var ov = fokusOvelse();
    var u = utkastRunder(ov.id)[fokusRunde()] || {};
    var sist = sisteFor(ov.id);
    var dom = document.getElementById('fokus-dom');
    if (!dom) return;
    if (sist && u.vekt && u.reps) {
      var diff = volum(u.vekt, u.reps) - volum(sist.vekt, sist.reps);
      dom.className = 'fokus-dom ' + (diff > 0 ? 'opp' : diff < 0 ? 'ned' : 'likt');
      dom.textContent = diff > 0 ? '▲ opp' : diff < 0 ? '▼ ned' : '= likt';
    } else {
      dom.className = 'fokus-dom';
      dom.textContent = '';
    }
    var fram = document.getElementById('fokus-fram');
    if (fram && fokusPos === fokusAntallSteg() - 1) fram.disabled = !harUtkast();
  }

  function koblingerFokus(siste) {
    document.getElementById('fokus-lukk').addEventListener('click', function () { lukkFokus(); });

    var tilbake = document.getElementById('fokus-tilbake');
    tilbake.addEventListener('click', function () { fokusGaTil(fokusPos - 1); });

    document.getElementById('fokus-fram').addEventListener('click', function () {
      if (siste) lagre(true);
      else fokusGaTil(fokusPos + 1);
    });

    document.querySelector('.fokus-runder').addEventListener('click', function (e) {
      var k = e.target.closest('button[data-pos]');
      if (k) fokusGaTil(Number(k.getAttribute('data-pos')));
    });

    var ov = fokusOvelse();
    var runde = fokusRunde();
    [['fv', 'vekt'], ['fr', 'reps']].forEach(function (par) {
      var el = document.getElementById(par[0]);
      el.addEventListener('input', function () {
        settFelt(ov.id, runde, par[1], el.value === '' ? null : parseFloat(el.value));
        oppdaterFokusDom();
      });
    });
  }

  // Sveip mellom øvelsene. Terskelen og kravet om at bevegelsen er mest
  // vannrett er der for at vanlig rulling nedover ikke skal bla ved et uhell,
  // og sveip som starter i et tallfelt lar vi være — der skal fingeren
  // markere tekst, ikke navigere.
  function kobleSveip() {
    var el = document.getElementById('fokus');
    var x0 = 0, y0 = 0, gyldig = false;

    el.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { gyldig = false; return; }
      var mål = e.target;
      gyldig = !(mål && (mål.tagName === 'INPUT' || mål.tagName === 'BUTTON'));
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
    }, { passive: true });

    el.addEventListener('touchend', function (e) {
      if (!gyldig || !e.changedTouches.length) return;
      var dx = e.changedTouches[0].clientX - x0;
      var dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      fokusGaTil(fokusPos + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }

  // ===== Innlogging =====
  function portFeil(tekst) {
    document.getElementById('port-feil').textContent = tekst || '';
  }

  function settPortModus(m) {
    portModus = m;
    var ny = m === 'ny';
    document.getElementById('port-tittel').textContent = ny ? 'Ny bruker' : 'Logg inn';
    document.getElementById('port-hjelp').textContent = ny
      ? 'Velg et navn og en firesifret PIN. Loggen din er privat — bare du ser den.'
      : 'Navnet ditt og PIN-en du valgte.';
    document.getElementById('p-pin2-boks').hidden = !ny;
    document.getElementById('p-pin').setAttribute('autocomplete', ny ? 'new-password' : 'current-password');
    document.getElementById('port-knapp').textContent = ny ? 'Registrer' : 'Logg inn';
    document.getElementById('port-bytt-tekst').textContent = ny ? 'Har du alt en bruker?' : 'Ny her?';
    document.getElementById('port-bytt').textContent = ny ? 'Logg inn' : 'Registrer deg';
    portFeil('');
  }

  function sendPort() {
    var navn = document.getElementById('p-navn').value.trim();
    var pin = document.getElementById('p-pin').value.trim();

    if (!navn) { portFeil('Skriv inn navnet ditt.'); return; }
    if (!/^\d{4}$/.test(pin)) { portFeil('PIN må være fire siffer.'); return; }

    var jobb;
    if (portModus === 'ny') {
      var pin2 = document.getElementById('p-pin2').value.trim();
      // Skrivefeil i PIN-en her ville låst brukeren ute av sin egen logg.
      if (pin !== pin2) { portFeil('De to PIN-kodene er ulike.'); return; }
      jobb = Api.register(navn, pin);
    } else {
      jobb = Api.login(navn, pin).then(function (r) {
        if (!r) throw new Error('Feil navn eller PIN.');
        return r;
      });
    }

    var knapp = document.getElementById('port-knapp');
    var opprinnelig = knapp.textContent;
    knapp.disabled = true;
    knapp.textContent = 'Vent …';
    portFeil('');

    jobb.then(function () {
      document.getElementById('p-pin').value = '';
      document.getElementById('p-pin2').value = '';
      knapp.disabled = false;
      knapp.textContent = opprinnelig;
      visApp();
    }).catch(function (e) {
      knapp.disabled = false;
      knapp.textContent = opprinnelig;
      portFeil(e.message || 'Kunne ikke logge inn.');
    });
  }

  function visPort() {
    document.getElementById('port').hidden = false;
    document.getElementById('innhold').hidden = true;
    document.getElementById('bruker').hidden = true;
    document.getElementById('antall').textContent = '–';
    oppdaterStempel('');
    settPortModus('inn');
    document.getElementById('p-navn').focus();
  }

  function visApp() {
    var u = Api.currentUser();
    document.getElementById('port').hidden = true;
    document.getElementById('bruker').hidden = false;
    oppdaterStempel(u ? u.name : '');

    var rot = document.getElementById('innhold');
    rot.hidden = false;
    rot.className = 'laster';
    rot.textContent = 'Henter loggen …';

    lastOkter().catch(function (e) {
      rot.className = 'laster';
      rot.textContent = e.message || 'Kunne ikke hente loggen.';
    });
  }

  function loggUt() {
    Api.logout();
    okter = [];
    alleOkter = [];
    brukere = [];
    utkast = {};
    utkastAnnet = { hva: '', minutter: '' };
    apenSatt = false;
    visPort();
  }

  function koblePort() {
    document.getElementById('port-knapp').addEventListener('click', sendPort);
    document.getElementById('port-bytt').addEventListener('click', function () {
      settPortModus(portModus === 'ny' ? 'inn' : 'ny');
    });
    document.getElementById('logg-ut').addEventListener('click', loggUt);

    ['p-navn', 'p-pin', 'p-pin2'].forEach(function (id) {
      document.getElementById(id).addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); sendPort(); }
      });
    });

    // PIN-feltene tar bare siffer, uansett hva tastaturet sender inn.
    ['p-pin', 'p-pin2'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
      });
    });
  }

  function start() {
    oppdaterStempel('');
    visVersjon();
    kobleTekstStorrelse();
    kobleTema();
    kobleSveip();
    koblePort();

    // Piltaster og Escape i fokus. Står markøren i et tallfelt, skal pilene
    // flytte markøren som vanlig — ikke bla til neste øvelse.
    document.addEventListener('keydown', function (e) {
      if (endringerErApne()) {
        if (e.key === 'Escape') lukkEndringer();
        return;
      }
      if (rettErApen()) {
        if (e.key === 'Escape') lukkRett();
        return;
      }
      if (!fokusErApen()) return;
      if (e.key === 'Escape') { lukkFokus(); return; }
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') fokusGaTil(fokusPos + 1);
      else if (e.key === 'ArrowLeft') fokusGaTil(fokusPos - 1);
    });

    // Nettleseren slipper Wake Lock når appen går i bakgrunnen. Er fokus
    // fortsatt åpent når du kommer tilbake, tar vi den igjen.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && fokusErApen()) taWakeLock();
    });

    if (Api.currentUser()) visApp();
    else visPort();
  }

  start();
})();
</script>
</body>
</html>
