<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F1">
<title>Styrkelogg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Tekststørrelse: alle font-size går gjennom denne. Settes på <html>. */
    --skala: 1;

    --paper: #F3F4F1;
    --plate: #FFFFFF;
    --etch: #D9DCD6;
    --etch-sterk: #C2C7BF;
    --ink: #1A2127;
    --dust: #6B757C;
    --verdigris: #1E7D6B;
    --verdigris-lys: #E8F3F0;
    --rust: #A8452F;
    /* «Lettere enn før» er ikke en advarsel, og skal ikke ha samme farge som
       «Unngå». Rolig oker i stedet for alarmrødt. Begge klarer WCAG AA på
       papirbakgrunnen (5,3:1). */
    --oker: #8A5A2B;
    --dust-sterk: #5C666D;
  }

  html[data-skala="liten"]  { --skala: 0.92; }
  html[data-skala="stor"]   { --skala: 1.14; }
  html[data-skala="storst"] { --skala: 1.3; }

  * { box-sizing: border-box; }

  /* Klasser som setter display (f.eks. .bruker med flex) overstyrer ellers
     hidden-attributtet, og elementet blir stående synlig. */
  [hidden] { display: none !important; }

  html, body { margin: 0; background: var(--paper); }

  #app {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    padding: 18px 14px 40px;
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .masthead {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 18px;
  }
  .kicker {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12px * var(--skala));
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dust);
    margin: 0 0 2px;
  }
  .masthead h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: calc(34px * var(--skala));
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 0;
    text-transform: uppercase;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 8px;
    font-size: calc(12px * var(--skala));
    color: var(--dust);
  }
  .meta strong {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(17px * var(--skala));
    font-weight: 600;
    color: var(--ink);
  }

  /* Innlogget bruker, under metalinja i mastheaden. */
  .bruker {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 6px;
    font-size: calc(12px * var(--skala));
    color: var(--dust);
  }
  .bruker b {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(15px * var(--skala));
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .tekststorrelse { display: flex; align-items: center; gap: 3px; }
  .tekststorrelse button {
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    color: var(--dust);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 2px;
    cursor: pointer;
  }
  .tekststorrelse button:nth-child(1) { font-size: 11px; }
  .tekststorrelse button:nth-child(2) { font-size: 13px; }
  .tekststorrelse button:nth-child(3) { font-size: 15px; }
  .tekststorrelse button:nth-child(4) { font-size: 17px; }
  .tekststorrelse button.valgt {
    border-color: var(--verdigris);
    color: var(--verdigris);
    background: var(--verdigris-lys);
  }

  .lenke {
    background: none;
    border: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: calc(12px * var(--skala));
    color: var(--verdigris);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .lenke:hover { color: var(--ink); }

  /* Versjonsnummeret sitter i tittelen, men skal ikke rope. */
  .versjon {
    border: none;
    background: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: calc(12px * var(--skala));
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    color: var(--verdigris);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    vertical-align: middle;
  }
  .versjon:hover { color: var(--ink); }

  #endringer {
    position: fixed;
    inset: 0;
    z-index: 95;
    display: none;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #endringer.apen { display: flex; }
  .endr-tittel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dust);
  }
  .endr-x {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    color: var(--dust);
    font-size: calc(15px * var(--skala));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .endr-topp {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 2px solid var(--ink);
    margin: 0 0 4px;
  }
  .endr-rull {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 0 16px 24px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .endr-post { border-top: 1px solid var(--etch); padding: 15px 0 4px; }
  .endr-post:first-child { border-top: none; }
  .endr-nr { display: flex; align-items: baseline; gap: 9px; }
  .endr-nr b {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(21px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .endr-nr span { font-size: calc(11.5px * var(--skala)); color: var(--dust); }
  .endr-post ul { margin: 9px 0 0; padding-left: 17px; }
  .endr-post li {
    font-size: calc(13px * var(--skala));
    line-height: 1.6;
    color: #4A545B;
    margin-bottom: 8px;
  }

  .banner {
    background: var(--verdigris-lys);
    border-left: 3px solid var(--verdigris);
    padding: 10px 12px;
    font-size: calc(13px * var(--skala));
    line-height: 1.5;
    color: #3A4A47;
    margin-bottom: 18px;
  }

  .rad {
    background: var(--plate);
    border: 1px solid var(--etch);
    border-radius: 3px;
    padding: 12px 12px 10px;
    margin-bottom: 10px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .rad.slatt {
    border-color: var(--verdigris);
    box-shadow: inset 3px 0 0 var(--verdigris);
  }

  .rad-topp {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .nr {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(13px * var(--skala));
    font-weight: 600;
    color: var(--dust);
    min-width: 16px;
  }
  .navn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(20px * var(--skala));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    flex: 1;
  }
  .maal {
    font-size: calc(11px * var(--skala));
    color: var(--dust);
    white-space: nowrap;
  }

  /* Hvordan øvelsen gjøres: to strekfigurer + kort instruksjon. */
  .hvordan {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    margin: 7px 0 9px 24px;
    padding: 8px 9px;
    background: var(--paper);
    border: 1px solid var(--etch);
    border-radius: 2px;
  }
  .figurer { display: flex; align-items: center; gap: 2px; flex: none; }
  .fig { width: 46px; height: 64px; color: var(--ink); }
  .fig .kropp {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fig .fyll { fill: currentColor; stroke: none; }
  .fig .bakke { stroke: var(--etch-sterk); stroke-width: 1.5; stroke-linecap: round; }
  .fig .vekt { fill: var(--verdigris); }
  .pil { color: var(--dust); font-size: calc(11px * var(--skala)); }
  .hvordan-tekst { min-width: 0; }
  .hvordan-tekst .utstyr {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--verdigris);
    margin: 0 0 3px;
  }
  .hvordan-tekst .slik {
    margin: 0;
    font-size: calc(11.5px * var(--skala));
    line-height: 1.5;
    color: #4A545B;
  }
  .hvordan-tekst .vis-mer { margin-top: 5px; }
  .hvordan-tekst .feil {
    margin: 4px 0 0;
    font-size: calc(11px * var(--skala));
    line-height: 1.45;
    color: var(--rust);
  }

  .forrige {
    font-size: calc(11.5px * var(--skala));
    color: var(--dust);
    margin: 0 0 9px 24px;
    font-variant-numeric: tabular-nums;
  }
  .forrige b { color: var(--ink); font-weight: 600; }

  .felter {
    display: flex;
    gap: 8px;
    margin-left: 24px;
    align-items: flex-end;
  }
  .felt { flex: 1; }
  .felt label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11px * var(--skala));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dust);
    margin-bottom: 3px;
  }
  .felt input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--etch-sterk);
    border-radius: 2px;
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(22px * var(--skala));
    font-weight: 600;
    padding: 7px 9px;
    font-variant-numeric: tabular-nums;
  }
  .felt input:focus {
    outline: 2px solid var(--verdigris);
    outline-offset: 1px;
    border-color: transparent;
    background: var(--plate);
  }
  .felt input::placeholder { color: #A9B0AC; font-weight: 400; }

  /* Én rad per runde: nummeret til venstre, vekt og reps ved siden av. */
  .runder { margin-left: 24px; }
  .runde-hode, .runde-linje { display: flex; align-items: center; gap: 8px; }
  .runde-linje { margin-top: 5px; }
  .runde-nr {
    flex: 0 0 22px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dust);
  }
  .runde-merk {
    flex: 1;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11px * var(--skala));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dust);
  }
  .runde-linje input {
    flex: 1;
    min-width: 0;
    background: var(--paper);
    border: 1px solid var(--etch-sterk);
    border-radius: 2px;
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(20px * var(--skala));
    font-weight: 600;
    padding: 5px 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .runde-linje input:focus {
    outline: 2px solid var(--verdigris);
    outline-offset: 1px;
    border-color: transparent;
    background: var(--plate);
  }
  .runde-linje input::placeholder { color: #A9B0AC; font-weight: 400; }

  .fokus-tidligere {
    text-align: center;
    font-size: calc(12px * var(--skala));
    color: var(--dust);
    margin: 5px 0 0;
    font-variant-numeric: tabular-nums;
  }

  .dommen {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(13px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: right;
    min-height: calc(17px * var(--skala));
    margin: 7px 0 2px;
  }
  .opp { color: var(--verdigris); }
  .likt { color: var(--dust); }
  .ned { color: var(--oker); }

  .lagre {
    width: 100%;
    background: var(--verdigris);
    color: #FFFFFF;
    border: none;
    border-radius: 3px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(19px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px;
    margin-top: 8px;
    cursor: pointer;
  }
  .lagre:disabled { background: var(--etch); color: var(--dust); cursor: default; }
  .lagre:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .kvittering {
    text-align: center;
    font-size: calc(12.5px * var(--skala));
    color: var(--verdigris);
    margin-top: 10px;
    min-height: 18px;
  }
  .kvittering.feil { color: var(--rust); }

  h2.seksjon {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(13px * var(--skala));
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dust);
    border-bottom: 1px solid var(--etch-sterk);
    padding-bottom: 6px;
    margin: 30px 0 12px;
    font-weight: 600;
  }

  /* ===== Utvikling ===== */
  .utv-topp {
    background: var(--plate);
    border: 1px solid var(--etch);
    border-left: 3px solid var(--verdigris);
    border-radius: 3px;
    padding: 12px 13px;
    margin-bottom: 12px;
  }
  .utv-overskrift {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.1;
    margin: 0;
  }
  .utv-sum { font-size: 12.5px; line-height: 1.5; color: var(--dust-sterk); margin: 5px 0 0; }
  .utv-trost {
    font-size: 12px;
    line-height: 1.55;
    color: var(--dust);
    margin: 9px 0 0;
    padding-top: 9px;
    border-top: 1px solid var(--etch);
  }

  .utv-rad {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--etch);
  }
  .utv-navn { flex: 1; min-width: 0; }
  .utv-navn b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .utv-navn span {
    display: block;
    font-size: 11.5px;
    color: var(--dust);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  /* Sparkline: linja er tilbaketrukket, siste økt bærer fargen. */
  .spark { width: 72px; height: 26px; flex: none; }
  .spark-linje {
    fill: none;
    stroke: var(--etch-sterk);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .spark-na { fill: var(--dust-sterk); }
  .spark-na.opp { fill: var(--verdigris); }
  .spark-na.lettere { fill: var(--oker); }

  .utv-dom {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
    flex: none;
    text-align: right;
    min-width: 74px;
    color: var(--dust-sterk);
  }
  .utv-dom.opp { color: var(--verdigris); }
  .utv-dom.lettere { color: var(--oker); }

  /* ===== Gjengen ===== */
  .gj-seksjon { display: flex; align-items: baseline; justify-content: space-between; }

  .gj-loft {
    background: var(--verdigris-lys);
    border-left: 3px solid var(--verdigris);
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .gj-loft-merke {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--verdigris);
    margin: 0;
  }
  .gj-loft-navn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(22px * var(--skala));
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 2px 0 0;
    line-height: 1.1;
  }
  .gj-loft-tall {
    font-size: calc(12.5px * var(--skala));
    line-height: 1.5;
    color: #3A4A47;
    margin: 3px 0 0;
    font-variant-numeric: tabular-nums;
  }

  .gj-rad { border-bottom: 1px solid var(--etch); padding: 10px 2px; }
  .gj-hode { display: flex; align-items: center; gap: 9px; }
  .gj-hode b {
    flex: 1;
    min-width: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(17px * var(--skala));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .gj-hode b em {
    font-style: normal;
    font-family: 'Inter', sans-serif;
    font-size: calc(11px * var(--skala));
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    color: var(--dust);
  }

  /* Én rute per økt programmet ber om. Fylt = gjort. */
  .gj-uke { display: flex; align-items: center; gap: 3px; flex: none; }
  .gj-uke i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
  }
  .gj-uke i.fylt { background: var(--verdigris); border-color: var(--verdigris); }
  .gj-uke em {
    font-style: normal;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11px * var(--skala));
    font-weight: 600;
    color: var(--verdigris);
    margin-left: 1px;
  }

  .gj-heia {
    flex: none;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: calc(13px * var(--skala));
    line-height: 1.3;
    cursor: pointer;
  }
  .gj-heia span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12px * var(--skala));
    font-weight: 700;
    color: var(--dust-sterk);
    margin-left: 2px;
  }
  .gj-heia.mitt { border-color: var(--verdigris); background: var(--verdigris-lys); }
  .gj-heia.mitt span { color: var(--verdigris); }
  .gj-heia:disabled { opacity: 0.5; cursor: default; }

  .gj-heiere {
    font-size: calc(11.5px * var(--skala));
    line-height: 1.5;
    color: var(--verdigris);
    margin: 3px 0 0;
  }

  .gj-x {
    flex: none;
    border: none;
    background: none;
    color: var(--etch-sterk);
    font-size: calc(13px * var(--skala));
    line-height: 1;
    padding: 3px 2px;
    cursor: pointer;
  }
  .gj-x:hover { color: var(--dust); }

  .gj-under {
    font-size: calc(11.5px * var(--skala));
    line-height: 1.5;
    color: var(--dust);
    margin: 3px 0 0;
  }
  .gj-dom {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--dust-sterk);
  }
  .gj-dom.opp { color: var(--verdigris); }
  .gj-dom.lettere { color: var(--oker); }

  .gj-skjulte {
    font-size: calc(11.5px * var(--skala));
    line-height: 1.6;
    color: var(--dust);
    margin: 10px 0 0;
  }

  .inviter {
    width: 100%;
    background: var(--plate);
    border: 1px solid var(--verdigris);
    border-radius: 3px;
    color: var(--verdigris);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(16px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 11px;
    margin-top: 14px;
    cursor: pointer;
  }

  .okt {
    border-bottom: 1px solid var(--etch);
    padding: 10px 0;
  }
  .okt-dato {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(16px * var(--skala));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .okt-tall {
    font-size: calc(11.5px * var(--skala));
    color: var(--dust);
    margin-top: 4px;
    line-height: 1.7;
    font-variant-numeric: tabular-nums;
  }
  .okt-tall span { display: inline-block; margin-right: 12px; }

  .tomt {
    color: var(--dust);
    font-size: calc(13px * var(--skala));
    line-height: 1.6;
    padding: 4px 0 8px;
  }

  .laster { color: var(--dust); font-size: calc(13px * var(--skala)); padding: 20px 0; text-align: center; }

  .fot {
    margin-top: 26px;
    display: flex;
    justify-content: center;
  }
  .slett {
    background: none;
    border: 1px solid var(--etch-sterk);
    color: var(--dust);
    font-family: 'Inter', sans-serif;
    font-size: calc(11.5px * var(--skala));
    padding: 7px 14px;
    border-radius: 2px;
    cursor: pointer;
  }
  .slett:hover { border-color: var(--rust); color: var(--rust); }
  .slett:disabled { cursor: default; opacity: .6; }

  /* ===== Innloggingsport ===== */
  .port { padding-top: 4px; }
  .port-hjelp {
    font-size: calc(13px * var(--skala));
    line-height: 1.55;
    color: var(--dust);
    margin: 0 0 16px;
  }
  .port-rad {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  /* Egne inputstiler i porten: navn og PIN leses bedre i Inter enn i den
     kondenserte tallskriften, og 18px hindrer at iOS zoomer inn ved fokus. */
  .port .felt input {
    font-family: 'Inter', sans-serif;
    font-size: calc(18px * var(--skala));
    font-weight: 500;
    padding: 10px 11px;
    background: var(--plate);
  }
  .port-feil {
    color: var(--rust);
    font-size: calc(12.5px * var(--skala));
    line-height: 1.5;
    min-height: 18px;
    margin: 2px 0 0;
  }
  .port-bytt {
    text-align: center;
    font-size: calc(12.5px * var(--skala));
    color: var(--dust);
    margin: 14px 0 0;
  }

  /* ===== Fokus: én øvelse i fullskjerm =====
     For telefonen satt fra deg mellom settene — store tall, store knapper,
     og skjermen holdes våken så den ikke sovner midt i en runde. */
  /* Hvilken dag økta føres på. Står øverst, over øvelsene, så det aldri er
     tvil — og lar en glemt økt føres uten å gå veien om «rett opp». */
  .okt-dag {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--plate);
    border: 1px solid var(--etch);
    border-radius: 3px;
    padding: 9px 11px;
    margin-bottom: 12px;
  }
  .okt-dag label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11.5px * var(--skala));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dust);
    flex: none;
  }
  .okt-dag input {
    flex: 1;
    min-width: 0;
    background: var(--paper);
    border: 1px solid var(--etch-sterk);
    border-radius: 2px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: calc(16px * var(--skala));
    padding: 6px 8px;
  }
  .okt-dag-navn {
    flex: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(13px * var(--skala));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--verdigris);
    white-space: nowrap;
  }

  /* Lagreknappen sier hvilken dag den skriver til. */
  .lagre span {
    display: block;
    font-size: calc(11.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: none;
    opacity: 0.85;
    margin-top: 1px;
  }

  .fokus-start {
    width: 100%;
    background: var(--verdigris);
    color: #FFFFFF;
    border: none;
    border-radius: 3px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(18px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px;
    margin-bottom: 16px;
    cursor: pointer;
    line-height: 1.15;
  }
  .fokus-start span {
    display: block;
    font-size: calc(11.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: none;
    opacity: 0.85;
    margin-top: 2px;
  }

  #fokus {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #fokus.apen { display: flex; }
  #fokus-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .fokus-topp {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 0;
  }
  .fokus-teller {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dust);
  }
  .fokus-x {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    color: var(--dust);
    font-size: calc(15px * var(--skala));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fokus-strek {
    height: 5px;
    background: var(--etch);
    border-radius: 3px;
    margin: 11px 16px 0;
    overflow: hidden;
  }
  .fokus-strek i { display: block; height: 100%; background: var(--verdigris); }

  .fokus-teller em { font-style: normal; opacity: 0.45; margin: 0 2px; }

  /* Femten prikker: tre grupper à fem. Fylt = gjort, ringet = der du står.
     Tappbare, så du kan hoppe rett til en runde du vil gjøre om igjen. */
  .fokus-runder {
    display: flex;
    justify-content: center;
    gap: 11px;
    padding: 10px 16px 0;
  }
  .rundegruppe { display: flex; gap: 4px; }
  .prikk {
    width: 14px;
    height: 14px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    cursor: pointer;
  }
  .prikk.gjort { background: var(--verdigris); border-color: var(--verdigris); }
  .prikk.na { border: 2px solid var(--verdigris); background: var(--verdigris-lys); }

  .fokus-rull { flex: 1; overflow-y: auto; min-height: 0; padding: 0 16px 14px; }

  .fokus-figurer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 16px 0 0;
  }
  .fokus-figurer .fig { width: 104px; height: 145px; }
  .fokus-figurer .pil { font-size: calc(17px * var(--skala)); }

  .fokus-navn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(32px * var(--skala));
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.05;
    text-align: center;
    margin: 10px 0 0;
  }
  .fokus-maal { text-align: center; font-size: calc(12.5px * var(--skala)); color: var(--dust); margin: 5px 0 0; }
  .fokus-maal b {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(13px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--verdigris);
  }
  .fokus-forrige {
    text-align: center;
    font-size: calc(13.5px * var(--skala));
    color: var(--dust);
    margin: 16px 0 0;
    font-variant-numeric: tabular-nums;
  }
  .fokus-forrige b { color: var(--ink); font-weight: 600; }

  .fokus-felter { display: flex; gap: 10px; margin-top: 10px; }
  .fokus-felt { flex: 1; }
  .fokus-felt label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11.5px * var(--skala));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dust);
    margin-bottom: 4px;
    text-align: center;
  }
  .fokus-felt input {
    width: 100%;
    background: var(--plate);
    border: 1px solid var(--etch-sterk);
    border-radius: 3px;
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(38px * var(--skala));
    font-weight: 600;
    padding: 8px 10px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .fokus-felt input:focus {
    outline: 2px solid var(--verdigris);
    outline-offset: 1px;
    border-color: transparent;
  }
  .fokus-felt input::placeholder { color: #A9B0AC; font-weight: 400; }

  .fokus-dom {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(21px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-height: 27px;
    margin-top: 12px;
  }

  .fokus-slik { font-size: calc(13px * var(--skala)); line-height: 1.55; color: #4A545B; margin: 16px 0 0; }
  .fokus-feil { font-size: calc(12px * var(--skala)); line-height: 1.5; color: var(--rust); margin: 6px 0 0; }
  .fokus-vaken { text-align: center; font-size: calc(11px * var(--skala)); color: var(--dust); margin: 14px 0 0; }

  .fokus-bunn {
    display: flex;
    gap: 10px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--etch);
  }
  .fokus-bunn button {
    height: 54px;
    border-radius: 3px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(17px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .fokus-tilbake {
    flex: 0 0 116px;
    font-size: calc(15px * var(--skala));
    white-space: nowrap;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    color: var(--dust);
  }
  .fokus-tilbake:disabled { opacity: 0.4; cursor: default; }
  .fokus-fram { flex: 1; border: none; background: var(--verdigris); color: #FFFFFF; }
  .fokus-fram:disabled { background: var(--etch); color: var(--dust); cursor: default; }

  /* ===== Rett opp en økt ===== */
  #rett {
    position: fixed;
    inset: 0;
    z-index: 92;
    display: none;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #rett.apen { display: flex; }
  #rett-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .rett-topp {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 2px solid var(--ink);
  }
  .rett-tittel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(12.5px * var(--skala));
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dust);
  }
  .rett-rull {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 14px 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .rett-dato label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(11.5px * var(--skala));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dust);
    margin-bottom: 4px;
  }
  .rett-dato input {
    width: 100%;
    background: var(--plate);
    border: 1px solid var(--etch-sterk);
    border-radius: 2px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: calc(17px * var(--skala));
    padding: 10px 11px;
  }
  .rett-ovelse { padding: 13px 0; border-bottom: 1px solid var(--etch); }
  .rett-navn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(16px * var(--skala));
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .rett-hode { display: flex; align-items: center; gap: 8px; }
  .rett-ovelse .runde-linje input { background: var(--plate); }
  .rett-varsel {
    font-size: calc(11.5px * var(--skala));
    line-height: 1.5;
    color: var(--dust);
    margin: 12px 0 0;
  }
  .rett-melding {
    font-size: calc(12.5px * var(--skala));
    line-height: 1.5;
    color: var(--rust);
    margin: 10px 0 0;
    min-height: 18px;
  }
  .rett-slett {
    width: 100%;
    background: none;
    border: 1px solid var(--etch-sterk);
    color: var(--dust);
    font-family: 'Inter', sans-serif;
    font-size: calc(12.5px * var(--skala));
    padding: 10px;
    border-radius: 2px;
    margin-top: 18px;
    cursor: pointer;
  }
  .rett-slett:hover { border-color: var(--rust); color: var(--rust); }
  .rett-slett:disabled { opacity: 0.5; cursor: default; }

  .rett-bunn { display: flex; gap: 10px; padding: 10px 16px 14px; border-top: 1px solid var(--etch); }
  .rett-bunn button {
    height: 52px;
    border-radius: 3px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: calc(16px * var(--skala));
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .rett-avbryt {
    flex: 0 0 110px;
    border: 1px solid var(--etch-sterk);
    background: var(--plate);
    color: var(--dust);
    white-space: nowrap;
  }
  .rett-lagre { flex: 1; border: none; background: var(--verdigris); color: #FFFFFF; }
  .rett-lagre:disabled { background: var(--etch); color: var(--dust); cursor: default; }

  /* Øktene i loggen er nå trykkbare. Raden beholder .okt — den er fortsatt
     én økt — og .okt-knapp legger bare knappe-nullstillingen oppå. Den står
     etter .okt i stilarket, så kant og luft kommer herfra. */
  .okt-knapp {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--etch);
    padding: 10px 2px;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .okt-knapp:hover { background: var(--plate); }
  .okt-rett {
    font-size: calc(11px * var(--skala));
    color: var(--verdigris);
    margin-left: 6px;
    white-space: nowrap;
  }

  /* ===== Programlenker under banneret ===== */
  .prog-rad {
    display: flex;
    gap: 14px;
    align-items: baseline;
    margin: -6px 0 16px;
  }

  /* ===== Utskrift =====
     Egen versjon av programmet framfor å prøve å tvinge skjermbildet gjennom
     en skriver: loggskjema, ingen knapper, og øvelser som ikke brekkes midt i. */
  #utskrift { display: none; }

  @media print {
    @page { margin: 14mm; }
    body > *:not(#utskrift) { display: none !important; }
    #utskrift { display: block; }

    body { background: #FFFFFF; }
    #utskrift {
      color: #000000;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 10.5pt;
      line-height: 1.45;
    }
    .pr-topp { border-bottom: 2px solid #000; padding-bottom: 6pt; margin-bottom: 10pt; }
    .pr-kicker {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 1pt;
    }
    .pr-topp h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26pt;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }
    .pr-slik { margin: 0 0 12pt; font-size: 10pt; }
    .pr-slik b { font-weight: 600; }

    .pr-ovelse {
      break-inside: avoid;
      page-break-inside: avoid;
      display: flex;
      gap: 10pt;
      align-items: flex-start;
      border-top: 0.5pt solid #999;
      padding: 7pt 0;
    }
    .pr-ovelse .fig { width: 52pt; height: 72pt; color: #000; }
    .pr-ovelse .figurer { display: flex; align-items: center; gap: 3pt; flex: none; }
    .pr-ovelse .fig .vekt { fill: #000; }
    .pr-ovelse .fig .bakke { stroke: #999; }
    .pr-tekst { flex: 1; min-width: 0; }
    .pr-navn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14pt;
      font-weight: 600;
      text-transform: uppercase;
      margin: 0;
    }
    .pr-maal { font-size: 9pt; margin: 0 0 3pt; }
    .pr-slik-tekst { margin: 0; font-size: 9.5pt; }
    .pr-feil { margin: 2pt 0 0; font-size: 9pt; font-style: italic; }

    .pr-skjema { break-inside: avoid; page-break-inside: avoid; margin-top: 14pt; }
    .pr-skjema h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11pt;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border-bottom: 0.5pt solid #000;
      padding-bottom: 3pt;
      margin: 0 0 6pt;
    }
    .pr-skjema table { width: 100%; border-collapse: collapse; font-size: 9pt; }
    .pr-skjema th, .pr-skjema td { border: 0.5pt solid #999; padding: 7pt 4pt; text-align: left; }
    .pr-skjema th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9pt;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: #EEE;
    }
    .pr-hint { font-size: 8.5pt; margin: 4pt 0 0; font-style: italic; }
    .pr-fot { margin-top: 12pt; font-size: 8.5pt; border-top: 0.5pt solid #999; padding-top: 5pt; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="masthead">
    <p class="kicker">10-minutters manualprogram</p>
    <h1>Styrkelogg <button type="button" class="versjon" id="versjon" title="Se hva som er nytt" hidden></button></h1>
    <div class="meta">
      <span>Økter loggført: <strong id="antall">–</strong></span>
      <span id="idag">–</span>
    </div>
    <div class="bruker" id="bruker" hidden>
      <span>Innlogget som <b id="bruker-navn"></b></span>
      <span class="tekststorrelse" id="tekststorrelse" role="group" aria-label="Tekststørrelse">
        <button type="button" data-skala="liten" title="Minst tekst" aria-label="Minst tekst">A</button>
        <button type="button" data-skala="normal" title="Vanlig tekst" aria-label="Vanlig tekst">A</button>
        <button type="button" data-skala="stor" title="Større tekst" aria-label="Større tekst">A</button>
        <button type="button" data-skala="storst" title="Størst tekst" aria-label="Størst tekst">A</button>
      </span>
      <button type="button" class="lenke" id="logg-ut">Logg ut</button>
    </div>
  </div>

  <div class="port" id="port" hidden>
    <h2 class="seksjon" id="port-tittel">Logg inn</h2>
    <p class="port-hjelp" id="port-hjelp">Navnet ditt og PIN-en du valgte.</p>

    <div class="port-rad">
      <div class="felt">
        <label for="p-navn">Navn</label>
        <input id="p-navn" type="text" maxlength="40" autocomplete="username" autocapitalize="words">
      </div>
    </div>
    <div class="port-rad">
      <div class="felt">
        <label for="p-pin">PIN — 4 siffer</label>
        <input id="p-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password">
      </div>
      <div class="felt" id="p-pin2-boks" hidden>
        <label for="p-pin2">Gjenta PIN</label>
        <input id="p-pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
      </div>
    </div>

    <p class="port-feil" id="port-feil"></p>
    <button class="lagre" id="port-knapp">Logg inn</button>
    <p class="port-bytt">
      <span id="port-bytt-tekst">Ny her?</span>
      <button type="button" class="lenke" id="port-bytt">Registrer deg</button>
    </p>
  </div>

  <div id="innhold" class="laster" hidden>Henter loggen …</div>
</div>

<div id="utskrift" aria-hidden="true"></div>

<div id="fokus" aria-hidden="true">
  <div id="fokus-body"></div>
</div>

<div id="rett" aria-hidden="true">
  <div id="rett-body"></div>
</div>

<div id="endringer" aria-hidden="true">
  <div class="endr-topp">
    <span class="endr-tittel">Hva som er nytt</span>
    <button class="endr-x" id="endr-lukk" aria-label="Lukk endringsloggen">✕</button>
  </div>
  <div class="endr-rull" id="endr-body"></div>
</div>

<script src="beregning.js"></script>
<script src="changelog.js"></script>
<script src="app-api.js"></script>
<script src="figurer.js"></script>
<script>
(function () {
  // Programmet kjøres som sirkel: 3 runder gjennom alle fem øvelsene.
  var RUNDER = 3;

  // Øvelsene, ordlyden hentet fra styrkeprogrammet.
  // «manualer» sier hvor mange manualer øvelsen krever — det avgjør hva du
  // fører inn: ved to manualer noteres vekta på én av dem, ikke summen.
  var OVELSER = [
    {
      id: 'knebøy', navn: 'Goblet knebøy', kort: 'Knebøy', maal: '10 reps', manualer: 1,
      slik: 'Hold én manual mot brystet med begge hender. Gå ned til lårene er parallelle med gulvet, brystet opp. Press opp gjennom hælene.',
      feil: 'Manualen for langt fram fra kroppen — da tipper du framover.'
    },
    {
      id: 'press', navn: 'Manualpress stående', kort: 'Press', maal: '8 reps', manualer: 2,
      slik: 'Manualer i skulderhøyde, håndflatene fram. Press rett opp over hodet til armene er strake. Kontrollert ned igjen.',
      feil: 'Svai i korsryggen. Spenn magen — svaier du, er vekta for tung.'
    },
    {
      id: 'roing', navn: 'Enarms roing', kort: 'Roing', maal: '8 reps per arm', manualer: 1,
      slik: 'Støtt hånd og kne på en benk eller stol. Ryggen flat som et bord. Dra manualen opp mot hofta, klem sammen i skulderbladet.',
      feil: 'Å dra mot skulderen, eller rotere overkroppen for å jukse siste rep.'
    },
    {
      id: 'markloft', navn: 'Rumensk markløft', kort: 'Markløft', maal: '10 reps', manualer: 2,
      slik: 'Manualer foran lårene, nesten strake knær. Skyv hofta bakover mens manualene glir nedover lårene. Kjenn strekket bak i låret, så opp igjen.',
      feil: 'Å gå ned som i knebøy. Hofta skal bakover, ikke ned.'
    },
    {
      id: 'utfall', navn: 'Utfall', kort: 'Utfall', maal: '8 reps per fot', manualer: 2,
      slik: 'Manual i hver hånd, armene rett ned. Ta et langt steg framover, senk bakre kne mot gulvet. Press deg tilbake til start.',
      feil: 'Å lene overkroppen framover. Fremre kne over ankelen, ikke forbi tærne.'
    }
  ];

  var okter = [];       // mine egne, eldst først
  var alleOkter = [];   // hele gjengen sine, eldst først
  var brukere = [];     // alle registrerte, også de som ikke har trent ennå
  var utkast = {};
  // Hvilken dag økta føres på. null = i dag. Å kunne velge dagen her er det
  // som gjør at en glemt økt ikke må gå veien om «rett opp» på en gammel dag.
  var oktDato = null;
  var portModus = 'inn'; // 'inn' | 'ny'

  // Regnestykkene bor i beregning.js, så de kan testes på millisekunder i Node
  // i stedet for gjennom en nettleser. Navnene beholdes her, så kallstedene
  // leser som før.
  var volum = Beregning.volum;
  var runderFor = Beregning.runderFor;
  var besteRunde = Beregning.besteRunde;
  var volumSerieFra = Beregning.volumSerieFra;
  var trend = Beregning.trend;
  var ukeStart = Beregning.ukeStart;
  var ukeNokkel = Beregning.ukeNokkel;
  var forrigeUke = Beregning.forrigeUke;
  var toSiffer = Beregning.toSiffer;
  var datoFeltVerdi = Beregning.datoFeltVerdi;
  var datoTekst = Beregning.datoTekst;
  var RORT = Beregning.RORT;

  // Loggen ligger eldst først, så bakoverløkka finner siste økt med et løft.
  function sisteFor(id) {
    for (var i = okter.length - 1; i >= 0; i--) {
      var b = besteRunde(okter[i], id);
      if (b) return b;
    }
    return null;
  }


  // Teksten kommer fra brukeren (navn) og fra serverens feilmeldinger, så den
  // må aldri tolkes som markup når den settes inn i en innerHTML-streng.
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Hvor mange manualer øvelsen krever. Ved to er det vekta på ÉN manual som
  // føres inn — ellers blir tallene i loggen ikke sammenliknbare.
  function utstyrTekst(ov) {
    return ov.manualer === 1 ? '1 manual' : '2 manualer — noter vekta på én';
  }

  // Figurene ligger i figurer.js. Skulle den filen mangle, faller blokka
  // tilbake til bare tekst i stedet for å kaste.
  function figurPar(id, klasse) {
    var f = (typeof FIG !== 'undefined') && FIG[id];
    if (!f) return '';
    return '<div class="' + klasse + '">' + f[0] + '<span class="pil">→</span>' + f[1] + '</div>';
  }

  // Figurene står alltid — de er den raske påminnelsen. Selve utførelsen ligger
  // bak et trykk, så loggeskjermen er kort å scrolle mens du trener. Fokus
  // viser den uansett i fullskjerm.
  function hvordanBlokk(ov) {
    return '<div class="hvordan">' + figurPar(ov.id, 'figurer') +
      '<div class="hvordan-tekst">' +
        '<p class="utstyr">' + utstyrTekst(ov) + '</p>' +
        '<div class="hvordan-mer" hidden>' +
          '<p class="slik">' + ov.slik + '</p>' +
          '<p class="feil">Unngå: ' + ov.feil + '</p>' +
        '</div>' +
        '<button type="button" class="lenke vis-mer">Vis utførelse</button>' +
      '</div></div>';
  }

  // ===== Loggskjermen =====
  function tegn() {
    var rot = document.getElementById('innhold');
    rot.className = '';

    var h = '';
    h += '<div class="banner"><b>3 runder</b> gjennom alle fem øvelsene. Minimal pause mellom øvelsene, 60 sekunder mellom rundene. De to siste repetisjonene skal kjennes tunge — klarer du 15 lett, er manualen for lett.' +
         '<br><br>Før inn vekt og reps fra den tyngste runden. Neste økt tar du én repetisjon mer, eller går opp til neste manualvekt — det er at tallene kryper oppover som gir resultater.</div>';

    h += programRad();

    h += '<div class="okt-dag"><label for="okt-dato">Økt for</label>' +
         '<input id="okt-dato" type="date" value="' + valgtDatoFelt() + '">' +
         '<span class="okt-dag-navn" id="okt-dag-navn">' + datoTekst(valgtDatoISO()) + '</span></div>';

    h += '<button class="fokus-start" id="fokus-start">Fokus' +
         '<span>én øvelse om gangen · store tall · skjermen sovner ikke</span></button>';

    OVELSER.forEach(function (ov, i) {
      var sist = sisteFor(ov.id);
      var beste = besteUtkast(ov.id);
      var slatt = sist && beste && volum(beste.vekt, beste.reps) > volum(sist.vekt, sist.reps);

      h += '<div class="rad' + (slatt ? ' slatt' : '') + '" id="rad-' + ov.id + '">';
      h += '  <div class="rad-topp"><span class="nr">' + (i + 1) + '</span>';
      h += '    <span class="navn">' + ov.navn + '</span>';
      h += '    <span class="maal">' + ov.maal + '</span></div>';

      h += hvordanBlokk(ov);

      if (sist) {
        h += '  <p class="forrige">Forrige: <b>' + sist.vekt + ' kg × ' + sist.reps + '</b></p>';
      } else {
        h += '  <p class="forrige">Ingen tidligere logg — dette blir utgangspunktet.</p>';
      }

      // Én rad per runde. Programmet er tre runder, og da skal det være tre
      // steder å skrive — ikke ett felt du overskriver tre ganger.
      h += '  <div class="runder">';
      h += '    <div class="runde-hode"><span class="runde-nr"></span>' +
           '<span class="runde-merk">Vekt (kg)</span><span class="runde-merk">Reps</span></div>';
      for (var r = 0; r < RUNDER; r++) {
        var ur = utkastRunder(ov.id)[r] || {};
        h += '<div class="runde-linje"><span class="runde-nr">R' + (r + 1) + '</span>' +
          '<input id="v-' + ov.id + '-' + r + '" type="number" inputmode="decimal" step="0.5" min="0"' +
          ' placeholder="–" aria-label="' + ov.navn + ', runde ' + (r + 1) + ', vekt"' +
          ' value="' + (ur.vekt != null ? ur.vekt : '') + '">' +
          '<input id="r-' + ov.id + '-' + r + '" type="number" inputmode="numeric" step="1" min="0"' +
          ' placeholder="–" aria-label="' + ov.navn + ', runde ' + (r + 1) + ', reps"' +
          ' value="' + (ur.reps != null ? ur.reps : '') + '">' +
          '</div>';
      }
      h += '  </div>';
      h += '  <div class="dommen ' + domKlasse(ov.id) + '">' + domTekst(ov.id) + '</div>';
      h += '</div>';
    });

    h += '<button class="lagre" id="lagre"' + (harUtkast() ? '' : ' disabled') + '>Lagre økta' +
         '<span id="lagre-dag">' + datoTekst(valgtDatoISO()) + '</span></button>';
    h += '<p class="kvittering" id="kvittering"></p>';

    h += utviklingBlokk();
    h += gjengenBlokk();

    h += '<h2 class="seksjon">Loggen</h2>';
    if (!okter.length) {
      h += '<p class="tomt">Ingen økter ennå. Første økt setter utgangspunktet — det er den eneste som ikke kan slås.</p>';
    } else {
      for (var j = okter.length - 1; j >= 0; j--) {
        var o = okter[j];
        h += '<button type="button" class="okt okt-knapp" data-rett="' + o.id +
             '" aria-label="Rett opp økta fra ' + datoTekst(o.dato) + '">' +
             '<div class="okt-dato">' + datoTekst(o.dato) +
             '<span class="okt-rett">rett opp</span></div><div class="okt-tall">';
        OVELSER.forEach(function (ov) {
          var b = besteRunde(o, ov.id);
          if (b) h += '<span>' + ov.kort + ' ' + b.vekt + '×' + b.reps + '</span>';
        });
        h += '</div></button>';
      }
      h += '<div class="fot"><button class="slett" id="slett">Tøm hele loggen</button></div>';
    }

    rot.innerHTML = h;
    koble();
  }

  function koble() {
    OVELSER.forEach(function (ov) {
      for (var r = 0; r < RUNDER; r++) {
        (function (runde) {
          ['v', 'r'].forEach(function (p) {
            var el = document.getElementById(p + '-' + ov.id + '-' + runde);
            if (!el) return;
            el.addEventListener('input', function () {
              var endret = settFelt(ov.id, runde,
                p === 'v' ? 'vekt' : 'reps',
                el.value === '' ? null : parseFloat(el.value));
              // Ble andre runder fylt ut, må feltene deres oppdateres. Vi
              // skriver rett i dem framfor å tegne kortet på nytt — ellers
              // mister feltet du står i markøren for hvert tastetrykk.
              if (endret) speilRunder(ov);
              oppdaterRad(ov);
              oppdaterKnapp();
            });
          });
        })(r);
      }
    });

    var l = document.getElementById('lagre');
    if (l) l.addEventListener('click', lagre);

    var s = document.getElementById('slett');
    if (s) s.addEventListener('click', tomLogg);

    var dagFelt = document.getElementById('okt-dato');
    if (dagFelt) dagFelt.addEventListener('change', function () {
      oktDato = dagFelt.value || null;
      var tekst = datoTekst(valgtDatoISO());
      var a = document.getElementById('okt-dag-navn');
      if (a) a.textContent = tekst;
      var b = document.getElementById('lagre-dag');
      if (b) b.textContent = tekst;
    });

    var f = document.getElementById('fokus-start');
    if (f) f.addEventListener('click', apneFokus);

    document.getElementById('innhold').querySelectorAll('[data-rett]').forEach(function (k) {
      k.addEventListener('click', function () { apneRett(k.getAttribute('data-rett')); });
    });

    var su = document.getElementById('skriv-ut');
    if (su) su.addEventListener('click', skrivUt);
    var kp = document.getElementById('kopier-program');
    if (kp) kp.addEventListener('click', kopierProgram);

    kobleGjengen();

    var mer = document.querySelectorAll('.vis-mer');
    for (var n = 0; n < mer.length; n++) {
      mer[n].addEventListener('click', function () {
        var boks = this.parentNode.querySelector('.hvordan-mer');
        var apner = boks.hidden;
        boks.hidden = !apner;
        this.textContent = apner ? 'Skjul utførelse' : 'Vis utførelse';
      });
    }
  }

  // Dommen sammenlikner beste utfylte runde med forrige økts beste.
  function domDiff(id) {
    var sist = sisteFor(id);
    var beste = besteUtkast(id);
    if (!sist || !beste) return null;
    return volum(beste.vekt, beste.reps) - volum(sist.vekt, sist.reps);
  }

  function domKlasse(id) {
    var d = domDiff(id);
    if (d === null) return 'likt';
    return d > 0 ? 'opp' : d < 0 ? 'ned' : 'likt';
  }

  function domTekst(id) {
    var d = domDiff(id);
    if (d === null) return '';
    return d > 0 ? '▲ opp' : d < 0 ? '▼ ned' : '= likt';
  }

  // Skriver utkastet tilbake i feltene uten å bygge kortet på nytt.
  function speilRunder(ov) {
    var liste = utkastRunder(ov.id);
    for (var r = 1; r < RUNDER; r++) {
      var post = liste[r] || {};
      var vf = document.getElementById('v-' + ov.id + '-' + r);
      var rf = document.getElementById('r-' + ov.id + '-' + r);
      if (vf && document.activeElement !== vf) vf.value = post.vekt != null ? post.vekt : '';
      if (rf && document.activeElement !== rf) rf.value = post.reps != null ? post.reps : '';
    }
  }

  function oppdaterRad(ov) {
    var rad = document.getElementById('rad-' + ov.id);
    var dom = rad.querySelector('.dommen');
    var d = domDiff(ov.id);
    dom.className = 'dommen ' + domKlasse(ov.id);
    dom.textContent = domTekst(ov.id);
    rad.classList.toggle('slatt', d !== null && d > 0);
  }

  // Utkastet holder én post per runde: utkast[øvelse][runde] = {vekt, reps}.
  function utkastRunder(id) {
    if (!Array.isArray(utkast[id])) utkast[id] = [];
    return utkast[id];
  }

  function utkastRunde(id, r) {
    var liste = utkastRunder(id);
    if (!liste[r]) liste[r] = {};
    return liste[r];
  }

  // Rundene er som regel like. Skriver du 6,5 kg × 8 i runde én, fylles de
  // øvrige med det samme — men bare de feltene du ikke selv har rørt.
  //
  // Merkingen er per FELT, ikke per runde. Retter du siste runde ned til 6
  // reps fordi forma sviktet, skal vekta der fortsatt følge runde én: den har
  // du ikke rørt. Merket vi hele runden, ville ett rettet tall frosset det
  // andre også.
  function spreFraForste(id) { Beregning.spreRunder(utkastRunder(id), RUNDER); }

  // Skriver et felt og forplanter fra runde én. Returnerer true når andre
  // runder ble endret, så den som kaller vet at feltene må speiles.
  function settFelt(id, runde, felt, verdi) {
    var post = utkastRunde(id, runde);
    post[felt] = verdi;
    post[RORT[felt]] = true;
    if (runde !== 0) return false;
    var for_ = JSON.stringify(utkastRunder(id));
    spreFraForste(id);
    return JSON.stringify(utkastRunder(id)) !== for_;
  }

  // Beste utfylte runde i utkastet — samme regel som for lagrede økter.
  function besteUtkast(id) {
    var beste = null;
    utkastRunder(id).forEach(function (r) {
      if (!r || !r.vekt || !r.reps) return;
      if (!beste || volum(r.vekt, r.reps) > volum(beste.vekt, beste.reps)) beste = r;
    });
    return beste;
  }

  function harUtkast() {
    return OVELSER.some(function (ov) { return !!besteUtkast(ov.id); });
  }

  function oppdaterKnapp() {
    var l = document.getElementById('lagre');
    if (l) l.disabled = !harUtkast();
  }

  // Datoen økta føres på. Uten valg: i dag, med klokkeslettet nå, så flere
  // økter samme dag beholder rekkefølgen sin.
  function valgtDatoISO() {
    if (!oktDato) return new Date().toISOString();
    return new Date(oktDato + 'T12:00:00').toISOString();
  }

  function valgtDatoFelt() {
    return oktDato || datoFeltVerdi(new Date().toISOString());
  }

  function kvittering(tekst, erFeil) {
    var k = document.getElementById('kvittering');
    if (!k) return;
    k.textContent = tekst;
    k.className = 'kvittering' + (erFeil ? ' feil' : '');
  }

  function oppdaterAntall() {
    var a = document.getElementById('antall');
    if (a) a.textContent = okter.length;
  }

  // ===== Utvikling over tid =====
  // Trenden regnes på volum (vekt × reps) per øvelse — se beregning.js. Volum
  // framfor vekt alene, fordi én rep mer er reell framgang selv med samme manual.
  function volumSerie(id) { return volumSerieFra(okter, id); }


  // Sparkline: linja i tilbaketrukket grått, siste økt som farget punkt.
  // Fargen er aldri eneste kanal — ordet og pila ved siden av sier det samme.
  function sparkline(v, retning) {
    var B = 72, H = 26, pad = 5;
    var lav = v[0].volum, hoy = v[0].volum, sum = 0;
    v.forEach(function (p) {
      if (p.volum < lav) lav = p.volum;
      if (p.volum > hoy) hoy = p.volum;
      sum += p.volum;
    });

    // Skalerer vi rett til min–maks, blir en vingling på én prosent tegnet som
    // en bratt bakke — mens ordet ved siden av sier «Som før». Domenet får
    // derfor en minstebredde på ti prosent av snittet, så små svingninger
    // ligger nesten flatt og bare reell endring fyller ruta.
    var snitt = sum / v.length;
    var domene = Math.max(hoy - lav, snitt * 0.1);
    var midt = (hoy + lav) / 2;
    var bunn = midt - domene / 2;
    var steg = v.length > 1 ? (B - pad * 2) / (v.length - 1) : 0;

    var pkt = v.map(function (p, i) {
      var x = pad + i * steg;
      var y = domene ? H - pad - ((p.volum - bunn) / domene) * (H - pad * 2) : H / 2;
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    });

    var linje = pkt.map(function (q) { return q[0] + ',' + q[1]; }).join(' ');
    var na = pkt[pkt.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + B + ' ' + H + '" aria-hidden="true">' +
      '<polyline class="spark-linje" points="' + linje + '"/>' +
      '<circle class="spark-na ' + retning + '" cx="' + na[0] + '" cy="' + na[1] + '" r="4"/>' +
      '</svg>';
  }

  function trendMerke(retning) {
    if (retning === 'opp') return '▲ Oppover';
    if (retning === 'lettere') return '▼ Lettere';
    return '= Som før';
  }

  function utviklingBlokk() {
    var h = '<h2 class="seksjon">Utvikling</h2>';

    if (okter.length < 2) {
      return h + '<p class="tomt">' + (okter.length
        ? 'Én økt loggført. Etter et par til kan vi vise hvilken vei det går.'
        : 'Ingen økter ennå — utviklingen dukker opp når du har logget et par.') + '</p>';
    }

    var rader = '';
    var tell = { opp: 0, likt: 0, lettere: 0 };
    OVELSER.forEach(function (ov) {
      var serie = volumSerie(ov.id);
      var t = trend(serie);
      if (!t) return;
      tell[t.retning]++;
      var sist = serie[serie.length - 1];
      rader += '<div class="utv-rad">' +
        '<div class="utv-navn"><b>' + ov.navn + '</b>' +
        '<span>Sist: ' + sist.vekt + ' kg × ' + sist.reps + '</span></div>' +
        sparkline(t.serie, t.retning) +
        '<span class="utv-dom ' + t.retning + '">' + trendMerke(t.retning) + '</span>' +
        '</div>';
    });

    if (!rader) {
      return h + '<p class="tomt">Ingen av øvelsene er loggført to ganger ennå. Da har vi ikke noe å sammenlikne.</p>';
    }

    var overskrift = tell.opp > tell.lettere ? 'Det går oppover'
      : tell.lettere > tell.opp ? 'Litt lettere om dagen'
      : 'Du holder nivået';

    var deler = [];
    if (tell.opp) deler.push(tell.opp + (tell.opp === 1 ? ' øvelse går' : ' øvelser går') + ' oppover');
    if (tell.likt) deler.push(tell.likt + ' ligger stabilt');
    if (tell.lettere) deler.push(tell.lettere + (tell.lettere === 1 ? ' er lettere' : ' er lettere') + ' enn før');
    var sum = deler.length > 1
      ? deler.slice(0, -1).join(', ') + ' og ' + deler[deler.length - 1]
      : deler[0];

    return h +
      '<div class="utv-topp">' +
        '<p class="utv-overskrift">' + overskrift + '</p>' +
        '<p class="utv-sum">' + sum + ', regnet over de siste øktene.</p>' +
        '<p class="utv-trost">Å løfte mindre er ikke et tilbakesteg. Dårlig søvn, en travel dag, ' +
        'eller noe annet du gjorde med kroppen i går — alt teller inn. Loggen er et minne om hva ' +
        'du faktisk gjorde, ikke en dom over det.</p>' +
      '</div>' + rader;
  }

  // ===== Rett opp eller slett én økt =====
  // Backenden har alltid kunnet begge deler; det var grensesnittet som manglet.
  // «Tøm hele loggen» er alt-eller-ingenting og duger ikke når ett tall ble feil.
  var rettId = null;

  function rettErApen() {
    return document.getElementById('rett').classList.contains('apen');
  }



  function finnOkt(id) {
    for (var i = 0; i < okter.length; i++) if (okter[i].id === id) return okter[i];
    return null;
  }

  function apneRett(id) {
    var o = finnOkt(id);
    if (!o) return;
    rettId = id;
    tegnRett(o);
    document.getElementById('rett').classList.add('apen');
    document.getElementById('rett').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function lukkRett() {
    rettId = null;
    document.getElementById('rett').classList.remove('apen');
    document.getElementById('rett').setAttribute('aria-hidden', 'true');
    if (!fokusErApen()) document.body.style.overflow = '';
  }

  function tegnRett(o) {
    var antallHeia = Array.isArray(o.heiarop) ? o.heiarop.length : 0;

    var h = '<div class="rett-topp">' +
      '<span class="rett-tittel">Rett opp økta</span>' +
      '<button class="endr-x" id="rett-lukk" aria-label="Lukk uten å lagre">✕</button></div>';

    h += '<div class="rett-rull">';
    h += '  <div class="rett-dato"><label for="rett-dato">Dato</label>' +
         '<input id="rett-dato" type="date" value="' + datoFeltVerdi(o.dato) + '"></div>';

    OVELSER.forEach(function (ov) {
      var runder = runderFor(o, ov.id);
      h += '<div class="rett-ovelse"><p class="rett-navn">' + ov.navn + '</p>';
      h += '<div class="rett-hode"><span class="runde-nr"></span>' +
           '<span class="runde-merk">Vekt</span><span class="runde-merk">Reps</span></div>';
      for (var r = 0; r < RUNDER; r++) {
        var e = runder[r] || {};
        h += '<div class="runde-linje"><span class="runde-nr">R' + (r + 1) + '</span>' +
          '<input id="rv-' + ov.id + '-' + r + '" type="number" inputmode="decimal" step="0.5" min="0"' +
          ' placeholder="–" aria-label="' + ov.navn + ', runde ' + (r + 1) + ', vekt"' +
          ' value="' + (e.vekt != null ? e.vekt : '') + '">' +
          '<input id="rr-' + ov.id + '-' + r + '" type="number" inputmode="numeric" step="1" min="0"' +
          ' placeholder="–" aria-label="' + ov.navn + ', runde ' + (r + 1) + ', reps"' +
          ' value="' + (e.reps != null ? e.reps : '') + '">' +
          '</div>';
      }
      h += '</div>';
    });

    h += '  <p class="rett-varsel">Tøm begge feltene for å fjerne en øvelse fra økta. ' +
         'Utviklingen og gjengen regnes om når du lagrer.' +
         (antallHeia ? ' Endrer du tallene, forsvinner de ' + antallHeia +
           (antallHeia === 1 ? ' heiaropet' : ' heiaropene') +
           ' på denne økta — de gjaldt løftene slik de sto.' : '') + '</p>';
    h += '  <p class="rett-melding" id="rett-melding"></p>';
    h += '  <button type="button" class="rett-slett" id="rett-slett">Slett denne økta</button>';
    h += '</div>';

    h += '<div class="rett-bunn">' +
      '<button class="rett-avbryt" id="rett-avbryt">Avbryt</button>' +
      '<button class="rett-lagre" id="rett-lagre">Lagre endringer</button></div>';

    document.getElementById('rett-body').innerHTML = h;
    koblingerRett(o);
  }

  function koblingerRett(o) {
    document.getElementById('rett-lukk').addEventListener('click', lukkRett);
    document.getElementById('rett-avbryt').addEventListener('click', lukkRett);
    document.getElementById('rett-lagre').addEventListener('click', function () { lagreRett(o); });
    document.getElementById('rett-slett').addEventListener('click', function () { slettOkt(o); });
  }

  function rettMelding(t) {
    var el = document.getElementById('rett-melding');
    if (el) el.textContent = t || '';
  }

  function lagreRett(o) {
    var ovelser = {};
    OVELSER.forEach(function (ov) {
      var runder = [];
      for (var r = 0; r < RUNDER; r++) {
        var v = parseFloat(document.getElementById('rv-' + ov.id + '-' + r).value);
        var reps = parseFloat(document.getElementById('rr-' + ov.id + '-' + r).value);
        if (v > 0 && reps > 0) runder.push({ vekt: v, reps: reps });
      }
      if (runder.length) ovelser[ov.id] = runder;
    });
    if (!Object.keys(ovelser).length) {
      rettMelding('En økt må ha minst ett løft. Vil du bli kvitt hele økta, slett den i stedet.');
      return;
    }

    var endring = { ovelser: ovelser };
    var nyDato = document.getElementById('rett-dato').value;
    // Send bare dato når den faktisk er endret, så klokkeslettet på økta
    // beholdes ved en ren tallretting.
    if (nyDato && nyDato !== datoFeltVerdi(o.dato)) {
      endring.dato = new Date(nyDato + 'T12:00:00').toISOString();
    }

    var knapp = document.getElementById('rett-lagre');
    knapp.disabled = true;
    knapp.textContent = 'Lagrer …';
    rettMelding('');

    Api.updateOkt(o.id, endring).then(function () {
      lukkRett();
      // Hent alt på nytt: rettingen flytter «forrige økt», utviklingskurven og
      // gjengens tall på én gang.
      return lastOkter().then(function () { kvittering('Økta er rettet opp.', false); });
    }).catch(function (e) {
      knapp.disabled = false;
      knapp.textContent = 'Lagre endringer';
      rettMelding(e.message || 'Kunne ikke lagre endringen.');
    });
  }

  function slettOkt(o) {
    if (!confirm('Sletter økta fra ' + datoTekst(o.dato) + '. Dette kan ikke angres.')) return;
    var knapp = document.getElementById('rett-slett');
    knapp.disabled = true;
    knapp.textContent = 'Sletter …';
    rettMelding('');

    Api.deleteOkt(o.id).then(function () {
      lukkRett();
      return lastOkter().then(function () { kvittering('Økta er slettet.', false); });
    }).catch(function (e) {
      knapp.disabled = false;
      knapp.textContent = 'Slett denne økta';
      rettMelding(e.message || 'Kunne ikke slette økta.');
    });
  }

  // ===== Programmet: utskrift og tekst =====
  // Begge bygges av samme OVELSER-liste som skjermen, så et endret mål eller
  // en rettet formulering slår gjennom alle tre stedene uten videre arbeid.
  var SLIK_KJORES = '3 runder gjennom alle fem øvelsene. Minimal pause mellom øvelsene, ' +
    '60 sekunder mellom rundene. De to siste repetisjonene skal kjennes tunge — ' +
    'klarer du 15 lett, er manualen for lett.';
  var PROGRESJON = 'Noter vekt og reps fra den tyngste runden. Neste økt tar du én repetisjon ' +
    'mer, eller går opp til neste manualvekt.';
  var LOGG_RADER = 6;

  function byggUtskrift() {
    var h = '<div class="pr-topp"><p class="pr-kicker">10-minutters manualprogram</p>' +
      '<h1>Styrkelogg</h1></div>';
    h += '<p class="pr-slik"><b>Slik kjører du økta.</b> ' + SLIK_KJORES + '</p>';

    OVELSER.forEach(function (ov, i) {
      h += '<div class="pr-ovelse">' + figurPar(ov.id, 'figurer') +
        '<div class="pr-tekst">' +
          '<p class="pr-navn">' + (i + 1) + '. ' + ov.navn + '</p>' +
          '<p class="pr-maal">' + ov.maal + ' · ' + utstyrTekst(ov) + '</p>' +
          '<p class="pr-slik-tekst">' + ov.slik + '</p>' +
          '<p class="pr-feil">Unngå: ' + ov.feil + '</p>' +
        '</div></div>';
    });

    // Tomt loggskjema, så arket kan henges opp og fylles ut for hånd.
    var celler = OVELSER.map(function (ov) {
      return '<th>' + ov.kort + '</th>';
    }).join('');
    var rader = '';
    for (var r = 0; r < LOGG_RADER; r++) {
      rader += '<tr><td></td>' + OVELSER.map(function () { return '<td></td>'; }).join('') + '</tr>';
    }

    h += '<div class="pr-skjema"><h2>Loggskjema</h2>' +
      '<table><thead><tr><th>Dato</th>' + celler + '</tr></thead>' +
      '<tbody>' + rader + '</tbody></table>' +
      '<p class="pr-hint">Noter vekt × reps fra den tyngste runden, for eksempel «24 × 10».</p></div>';

    h += '<p class="pr-fot">' + PROGRESJON + ' — bedreliv.netlify.app' +
      (typeof CHANGELOG !== 'undefined' && CHANGELOG.length ? ' · v' + CHANGELOG[0].v : '') + '</p>';

    document.getElementById('utskrift').innerHTML = h;
  }

  function skrivUt() {
    byggUtskrift();
    window.print();
  }

  function programSomTekst() {
    var l = [];
    l.push('STYRKELOGG — 10-minutters manualprogram');
    l.push('');
    l.push(SLIK_KJORES);
    l.push('');
    OVELSER.forEach(function (ov, i) {
      l.push((i + 1) + '. ' + ov.navn.toUpperCase() + ' — ' + ov.maal + ' — ' + utstyrTekst(ov));
      l.push('   ' + ov.slik);
      l.push('   Unngå: ' + ov.feil);
      l.push('');
    });
    l.push(PROGRESJON);
    l.push('');
    l.push('Logg øktene i appen: bedreliv.netlify.app');
    return l.join('\n');
  }

  function kopierProgram() {
    var tekst = programSomTekst();
    var kvitt = document.getElementById('program-kvitt');
    var si = function (t) { if (kvitt) kvitt.textContent = t; };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tekst)
        .then(function () { si('Programmet er kopiert — lim det inn der du vil.'); })
        .catch(function () { si('Fikk ikke kopiert. Bruk «Skriv ut» i stedet.'); });
      return;
    }
    si('Nettleseren din har ikke utklippstavle. Bruk «Skriv ut» i stedet.');
  }

  function programRad() {
    return '<div class="prog-rad">' +
      '<button type="button" class="lenke" id="skriv-ut">Skriv ut programmet</button>' +
      '<button type="button" class="lenke" id="kopier-program">Kopier som tekst</button>' +
      '</div><p class="kvittering" id="program-kvitt"></p>';
  }

  // ===== Gjengen =====
  // Bedreliv er en venneapp: alle ser alle. Du kan ikke skru av at DU er
  // synlig for andre — men du bestemmer over din egen skjerm, og kan både
  // legge bort hele delen og skjule enkeltpersoner fra din visning.
  var GJENG_KEY = 'bedrelivGjengSkjult';
  var SKJULTE_KEY = 'bedrelivSkjulte';
  var MAL_PER_UKE = 2;   // programmet: to ganger i uka

  function gjengSkjult() {
    try { return localStorage.getItem(GJENG_KEY) === '1'; } catch (e) { return false; }
  }

  function skjultePersoner() {
    try { return JSON.parse(localStorage.getItem(SKJULTE_KEY)) || []; } catch (e) { return []; }
  }

  function lagreSkjulte(liste) {
    try { localStorage.setItem(SKJULTE_KEY, JSON.stringify(liste)); } catch (e) {}
  }


  // Uker på rad med minst to økter. Inneværende uke er ennå ikke over, så den
  // bryter aldri rekka — er den ikke fylt opp, telles det fra forrige uke.
  function ukerPaaRad(dater) { return Beregning.ukerPaaRad(dater, MAL_PER_UKE); }

  // Retningen til én person: samme øvelsesvise trend som din egen utvikling,
  // og så flertallet. Totalvolum per økt ville vært misvisende — en økt der du
  // rakk to øvelser ville sett ut som et fall.
  function personRetning(egneOkter) {
    return Beregning.personRetning(egneOkter, OVELSER.map(function (ov) { return ov.id; }));
  }

  function grupperPerPerson() {
    var pers = {};
    // Alle registrerte er med fra dag én, også før første økt. Navnet fra
    // registeret er fasit; savedBy brukes bare for folk vi ikke fant der.
    brukere.forEach(function (b) {
      if (b && b.id) pers[b.id] = { id: b.id, navn: b.navn || 'Ukjent', registrert: true, okter: [] };
    });
    alleOkter.forEach(function (o) {
      var id = o.ownerId || 'ukjent';
      if (!pers[id]) pers[id] = { id: id, navn: o.savedBy || 'Ukjent', registrert: false, okter: [] };
      if (!pers[id].registrert && o.savedBy) pers[id].navn = o.savedBy;
      pers[id].okter.push(o);
    });
    return pers;
  }

  function gjengData() {
    var pers = grupperPerPerson();
    var naa = ukeNokkel(new Date());
    var meg = Api.currentUserId();

    return Object.keys(pers).map(function (k) {
      var p = pers[k];
      var dater = p.okter.map(function (o) { return new Date(o.dato); });
      return {
        id: p.id,
        navn: p.navn,
        erMeg: p.id === meg,
        antall: p.okter.length,
        iUka: dater.filter(function (d) { return ukeNokkel(d) === naa; }).length,
        rad: ukerPaaRad(dater),
        sist: dater.length ? dater[dater.length - 1] : null,
        sisteOkt: p.okter.length ? p.okter[p.okter.length - 1] : null,
        retning: personRetning(p.okter)
      };
    }).sort(function (a, b) {
      // Flest økter denne uka øverst, så flest uker på rad. Aldri etter vekt:
      // det ville gjort den sterkeste til evig vinner.
      if (b.iUka !== a.iUka) return b.iUka - a.iUka;
      if (b.rad !== a.rad) return b.rad - a.rad;
      return a.navn.localeCompare(b.navn, 'nb');
    });
  }

  // Ukas løft: den største RELATIVE framgangen denne uka, målt mot personens
  // egen forrige økt i samme øvelse. Relativt, ikke absolutt — ellers vinner
  // den tyngste hver uke, og alle andre slutter å se etter.
  function ukasLoft() {
    var pers = grupperPerPerson();
    var naa = ukeNokkel(new Date());
    var best = null;

    Object.keys(pers).forEach(function (k) {
      var p = pers[k];
      OVELSER.forEach(function (ov) {
        var rekke = [];
        p.okter.forEach(function (o) {
          var b = besteRunde(o, ov.id);
          if (b) rekke.push({ dato: new Date(o.dato), e: b });
        });
        if (rekke.length < 2) return;
        var siste = rekke[rekke.length - 1];
        if (ukeNokkel(siste.dato) !== naa) return;
        var forrige = rekke[rekke.length - 2];
        var fra = forrige.e.vekt * forrige.e.reps;
        var til = siste.e.vekt * siste.e.reps;
        if (!fra || til <= fra) return;
        var pst = (til - fra) / fra;
        if (!best || pst > best.pst) {
          best = {
            navn: p.navn, ovelse: ov.navn, pst: pst,
            fra: forrige.e, til: siste.e
          };
        }
      });
    });
    return best;
  }

  function ukePrikker(n) {
    var ut = '<span class="gj-uke" aria-label="' + n + ' av ' + MAL_PER_UKE + ' økter denne uka">';
    for (var i = 0; i < MAL_PER_UKE; i++) ut += '<i' + (i < n ? ' class="fylt"' : '') + '></i>';
    if (n > MAL_PER_UKE) ut += '<em>+' + (n - MAL_PER_UKE) + '</em>';
    return ut + '</span>';
  }

  function sidenTekst(d) {
    if (!d) return 'ingen økter ennå';
    var dager = Math.round((ukeStart(new Date()).getTime() - ukeStart(d).getTime()) / 604800000);
    var iDag = new Date(); iDag.setHours(0, 0, 0, 0);
    var da = new Date(d); da.setHours(0, 0, 0, 0);
    var diff = Math.round((iDag - da) / 86400000);
    if (diff <= 0) return 'trente i dag';
    if (diff === 1) return 'trente i går';
    if (diff < 7) return 'trente for ' + diff + ' dager siden';
    if (diff < 14) return 'trente forrige uke';
    return 'sist for ' + Math.floor(diff / 7) + ' uker siden';
  }

  function gjengenBlokk() {
    var h = '<h2 class="seksjon gj-seksjon">Gjengen' +
      '<button type="button" class="lenke" id="gj-bryter">' +
      (gjengSkjult() ? 'Vis' : 'Skjul') + '</button></h2>';

    if (gjengSkjult()) {
      return h + '<p class="tomt">Gjengen er lagt bort på din skjerm. De andre ser deg fortsatt — ' +
        'det er hele poenget med en venneapp.</p>';
    }

    var alle = gjengData();
    // Spørsmålet er om det finnes NOEN ANDRE enn meg, ikke hvor mange rader
    // lista har. Teller man rader, forsvinner en venn i det øyeblikket jeg
    // selv mangler fra lista — og meldingen påstår «bare deg her» om en liste
    // som inneholder vennen og ikke meg.
    var andre = alle.filter(function (p) { return !p.erMeg; });
    if (!andre.length) {
      return h + '<p class="tomt">Foreløpig er det bare deg her. Inviter noen, så blir det gøyere.</p>' +
        inviterKnapp();
    }

    var skjulte = skjultePersoner();
    var vist = alle.filter(function (p) { return skjulte.indexOf(p.id) < 0; });

    var loft = ukasLoft();
    var loftHtml = loft
      ? '<div class="gj-loft"><p class="gj-loft-merke">Ukas løft</p>' +
        '<p class="gj-loft-navn">' + esc(loft.navn) + '</p>' +
        '<p class="gj-loft-tall">' + loft.ovelse + ': ' + loft.fra.vekt + ' kg × ' + loft.fra.reps +
        ' → <b>' + loft.til.vekt + ' kg × ' + loft.til.reps + '</b> ' +
        '(+' + Math.round(loft.pst * 100) + ' %)</p></div>'
      : '<div class="gj-loft"><p class="gj-loft-merke">Ukas løft</p>' +
        '<p class="gj-loft-tall">Ingen har slått seg selv denne uka ennå. Det er fortsatt tid.</p></div>';

    var rader = vist.map(function (p) {
      var ord = p.antall === 0 ? 'Ikke i gang ennå'
        : p.retning ? trendMerke(p.retning) : 'For få økter';
      var klasse = p.retning || '';
      var biter = [];
      if (p.antall === 0) {
        // «0 økter totalt · ingen økter ennå» sier det samme to ganger.
        biter.push(p.erMeg ? 'du har ikke loggført noe ennå' : 'har ikke loggført noe ennå');
      } else {
        if (p.rad) biter.push(p.rad + (p.rad === 1 ? ' uke på rad' : ' uker på rad'));
        biter.push(sidenTekst(p.sist));
        biter.push(p.antall + (p.antall === 1 ? ' økt totalt' : ' økter totalt'));
      }

      return '<div class="gj-rad">' +
        '<div class="gj-hode">' +
          '<b>' + esc(p.navn) + (p.erMeg ? ' <em>(deg)</em>' : '') + '</b>' +
          ukePrikker(p.iUka) +
          heiaropKnapp(p) +
          (p.erMeg ? '' : '<button type="button" class="gj-x" data-skjul="' + p.id +
            '" aria-label="Skjul ' + esc(p.navn) + ' fra min visning">✕</button>') +
        '</div>' +
        '<p class="gj-under"><span class="gj-dom ' + klasse + '">' + ord + '</span> · ' +
        biter.join(' · ') + '</p>' +
        heiaropLinje(p) +
        '</div>';
    }).join('');

    var skjultHtml = '';
    if (skjulte.length) {
      var navn = alle.filter(function (p) { return skjulte.indexOf(p.id) >= 0; });
      skjultHtml = '<p class="gj-skjulte">Skjult på din skjerm: ' +
        navn.map(function (p) {
          return '<button type="button" class="lenke" data-vis="' + p.id + '">' + esc(p.navn) + '</button>';
        }).join(', ') + ' — trykk for å hente tilbake.</p>';
    }

    return h + loftHtml + rader + skjultHtml + inviterKnapp();
  }

  // Heiaropet henger på personens SISTE økt — det er den man heier på når man
  // ser at noen har trent. Trykk igjen tar det bort.
  function heiaropListe(p) {
    return (p.sisteOkt && Array.isArray(p.sisteOkt.heiarop)) ? p.sisteOkt.heiarop : [];
  }

  function heiaropKnapp(p) {
    // Du kan ikke heie på deg selv — men du ser hvem som heier på deg.
    if (p.erMeg || !p.sisteOkt) return '';
    var liste = heiaropListe(p);
    var meg = Api.currentUserId();
    var mitt = liste.some(function (h) { return h && h.id === meg; });
    return '<button type="button" class="gj-heia' + (mitt ? ' mitt' : '') + '"' +
      ' data-heia="' + p.sisteOkt.id + '"' +
      ' aria-label="' + (mitt ? 'Ta bort heiaropet ditt til ' : 'Hei på ') + esc(p.navn) + '">' +
      '👏' + (liste.length ? ' <span>' + liste.length + '</span>' : '') + '</button>';
  }

  function heiaropLinje(p) {
    var liste = heiaropListe(p);
    if (!liste.length) return '';
    var meg = Api.currentUserId();
    var navn = liste.map(function (h) { return h.id === meg ? 'Du' : (h.navn || 'Noen'); });
    // «Du» først når du er med — det er slik man leser en slik setning.
    navn.sort(function (a, b) { return a === 'Du' ? -1 : b === 'Du' ? 1 : 0; });
    var tekst = navn.length === 1 ? navn[0]
      : navn.slice(0, -1).join(', ') + ' og ' + navn[navn.length - 1];
    var verb = (navn.length === 1 && navn[0] === 'Du') ? 'heier' : 'heier';
    return '<p class="gj-heiere">' + esc(tekst) + ' ' + verb + ' på siste økt</p>';
  }

  function inviterKnapp() {
    return '<button type="button" class="inviter" id="inviter">Inviter en venn</button>' +
      '<p class="kvittering" id="invitert"></p>';
  }

  function kobleGjengen() {
    var bryter = document.getElementById('gj-bryter');
    if (bryter) bryter.addEventListener('click', function () {
      try { localStorage.setItem(GJENG_KEY, gjengSkjult() ? '0' : '1'); } catch (e) {}
      tegn();
    });

    var vert = document.getElementById('innhold');
    vert.querySelectorAll('[data-skjul]').forEach(function (k) {
      k.addEventListener('click', function () {
        var liste = skjultePersoner();
        liste.push(k.getAttribute('data-skjul'));
        lagreSkjulte(liste);
        tegn();
      });
    });
    vert.querySelectorAll('[data-vis]').forEach(function (k) {
      k.addEventListener('click', function () {
        var id = k.getAttribute('data-vis');
        lagreSkjulte(skjultePersoner().filter(function (x) { return x !== id; }));
        tegn();
      });
    });

    vert.querySelectorAll('[data-heia]').forEach(function (k) {
      k.addEventListener('click', function () { heiPaa(k, k.getAttribute('data-heia')); });
    });

    var inv = document.getElementById('inviter');
    if (inv) inv.addEventListener('click', inviter);
  }

  function heiPaa(knapp, oktId) {
    knapp.disabled = true;
    Api.heiarop(oktId).then(function (svar) {
      // Oppdater økta vi alt har i minnet, så skjermen kan tegnes uten å
      // hente hele lista på nytt.
      for (var i = 0; i < alleOkter.length; i++) {
        if (alleOkter[i].id === oktId) { alleOkter[i].heiarop = svar.heiarop; break; }
      }
      tegn();
    }).catch(function (e) {
      knapp.disabled = false;
      var kvitt = document.getElementById('invitert');
      if (kvitt) kvitt.textContent = e.message || 'Kunne ikke heie akkurat nå.';
    });
  }

  function inviter() {
    var lenke = location.origin + location.pathname;
    var tekst = 'Bli med i styrkeloggen — 10 minutter, to ganger i uka.';
    var kvitt = document.getElementById('invitert');
    var si = function (t) { if (kvitt) kvitt.textContent = t; };

    if (navigator.share) {
      // Avbryter du delingsmenyen, kaster den. Det er ikke en feil å melde om.
      navigator.share({ title: 'Bedreliv — Styrkelogg', text: tekst, url: lenke }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
